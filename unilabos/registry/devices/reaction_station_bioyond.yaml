                torque_variation:
                  default: 2
                  description: 是否观察(NO=1, YES=2)
                  type: integer
                volume_formula:
                  description: 分液公式(μL),如果提供则直接使用,否则自动计算
                  type: string
                x_value:
                  description: 手工输入的x值,格式如 "1-2-3"
