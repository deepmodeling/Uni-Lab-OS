          "barcode": "DEV-PUMP-XYF-01",
          "position": {"x": 500, "y": 100, "z": 0},
          "config": {"port": "MOCK"},
          "data": {
            "status": "Idle",
            "current_device": "pump_01",
            "pump_state": "Stopped",
