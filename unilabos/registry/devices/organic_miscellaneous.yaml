          type: integer
        baudrate_sensor:
          default: 115200
          type: integer
        port_executor:
          type: string
        port_sensor:
          type: string
      required:
      - port_executor
      - port_sensor
      type: object
    data:
      properties: {}
      required: []
      type: object
  version: 1.0.0
