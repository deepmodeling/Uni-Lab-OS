# 保留上游发行包及字体许可；full 集成测试会导入全部字体并执行 pip check。
package:
  name: rinoh-typeface-texgyreheros
  version: 0.1.1
source:
  url: https://files.pythonhosted.org/packages/8e/62/3b28c30558fd53590797c455bb46ab47599c2b9145a09e7ae162dd625426/rinoh-typeface-texgyreheros-0.1.1.tar.gz
  sha256: fd7082e917bccc292894447f11d15a3efce9f1386056118b57b66cc2f5a36bbd
build:
  noarch: python
  number: 1
  script: python -m pip install . --no-deps --no-build-isolation
requirements:
  host:
    - python >=3.14,<3.15
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.14,<3.15
    - rinohtype >=0.5.4
tests:
  # 单个字体构建时其余字体尚未构建；这里验证字体数据和入口，full 再验证完整依赖闭环。
  - script:
      - python -c "from importlib.metadata import distribution; d = distribution('rinoh-typeface-texgyreheros'); assert d.version == '0.1.1'; assert any(str(p).endswith('.otf') and d.locate_file(p).is_file() for p in d.files); assert any(p.group == 'rinoh.typefaces' for p in d.entry_points)"
about:
  homepage: https://github.com/brechtm/rinoh-typeface-texgyreheros
  license: LicenseRef-GUST-Font-License
  license_file: rinoh_typeface_texgyreheros/GUST-FONT-LICENSE.txt
  summary: Original texgyreheros font package for the complete documentation environment
