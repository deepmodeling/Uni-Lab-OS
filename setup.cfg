[install]
install_scripts=$base/lib/unilabos

[flake8]
max-line-length = 120
# Historical baseline for enabling flake8 across the full repository.
# Remove codes from this list incrementally as the corresponding files are cleaned up.
extend-ignore =
    E114,
    E201,
    E202,
    E203,
    E231,
    E266,
    E402,
    E501,
    E711,
    E712,
    E713,
    E721,
    E722,
    E999,
    F401,
    F403,
    F405,
    F541,
    F811,
    F821,
    F824,
    F841,
    W291,
    W292,
    W293,
    W503,
    W605
extend-exclude =
    .conda,
    .cursor,
    .git,
    .mypy_cache,
    .pytest_cache,
    .venv,
    __pycache__,
    build,
    dist,
    unilabos_local_ui/node_modules,
    unilabos_local_ui/dist
