# 与配套 wheel 共用提交和版本补丁，pip check 也能识别 fork，不能复用旧构建坐标。
package:
  name: pylabrobot-unilab
  version: 1.0.0b1+unilabos.d8153b8b3e06.ot10
source:
  url: https://github.com/Xuwznln/pylabrobot/archive/d8153b8b3e06df6a0d3f602ffaec75912fbeeb66.tar.gz
  sha256: fb59ff94eebdecddaa542170f3f92f6a30efb8010d3ddaf59ae2a710a1fed6cc
  patches:
    - unilab-version.patch
    - opentrons-dependency.patch
build:
  noarch: python
  number: 0
  string: py314_0
  script: python -m pip install . --no-deps --no-build-isolation
requirements:
  host:
    - python >=3.14,<3.15
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.14,<3.15
    - typing_extensions
    - websockets >=14
    - opentrons-shared-data ==10.1.0+unilabos.np2.1 py314_np2_1
tests:
  - python:
      imports:
        - pylabrobot.resources
      pip_check: true
  - script:
      - python -c "import importlib.metadata as m; assert m.version('pylabrobot') == '1.0.0b1+unilabos.d8153b8b3e06.ot10'"
      - python -c "import numpy as np; from opentrons_shared_data.labware import labware_definition as ld; from pylabrobot.resources.opentrons.plates import corning_96_wellplate_360ul_flat; assert int(np.__version__.split('.')[0]) == 2; assert ld.trapezoid([1, 2, 3]) == 4; assert corning_96_wellplate_360ul_flat('conda_check').num_items == 96"
about:
  license: MIT
  summary: Pinned UniLabOS PyLabRobot resource integration
