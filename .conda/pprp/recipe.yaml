# full 内置驱动需要的纯 Python SDK；公共 Conda channel 暂无此包。
package:
  name: pprp
  version: 0.2.7
source:
  url: https://files.pythonhosted.org/packages/7d/8a/6bcc32e0f6cf0a9e0132230cb41652bd3df3dbdb0e673e31b720b6111deb/pprp-0.2.7.tar.gz
  sha256: d9e76779cc52b0938dbc7f5727a195dc4c6075c3eb504025611a59b7636b930d
build:
  noarch: python
  number: 1
  script: python -m pip install . --no-deps --no-build-isolation
requirements:
  host:
    - python >=3.14,<3.15
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.14,<3.15
    # 上游包把测试工具声明成必需依赖，保留原始元数据，不用 --no-deps 绕过。
    - coverage
    - nose
tests:
  - python:
      imports:
        - pprp
      pip_check: true
about:
  homepage: https://github.com/dsoprea/RijndaelPbkdf
  license: GPL-2.0-only
  summary: Pure Python Rijndael and PBKDF2 library for optional device drivers
