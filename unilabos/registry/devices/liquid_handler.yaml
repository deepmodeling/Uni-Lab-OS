liquid_handler:
  available_sites: []
  category:
  - liquid_handler
  class:
    action_value_mappings:
      add_liquid:
        error_policy: {}
        feedback: {}
        goal:
          asp_vols: asp_vols
          blow_out_air_volume: blow_out_air_volume
          delays: delays
          dis_vols: dis_vols
          flow_rates: flow_rates
          is_96_well: is_96_well
          liquid_height: liquid_height
          mix_liquid_height: mix_liquid_height
          mix_rate: mix_rate
          mix_time: mix_time
          mix_vol: mix_vol
          none_keys: none_keys
          offsets: offsets
          reagent_sources: reagent_sources
          spread: spread
          targets: targets
          use_channels: use_channels
        goal_default:
          asp_vols: null
          blow_out_air_volume: null
          delays: null
          dis_vols: null
          flow_rates: null
          is_96_well: false
          liquid_height: null
          mix_liquid_height: null
          mix_rate: null
          mix_time: null
          mix_vol: null
          none_keys: []
          offsets: null
          reagent_sources: null
          spread: wide
          targets: null
          touch_tip: false
          use_channels: null
        handles: {}
        placeholder_keys:
          reagent_sources: unilabos_resources
          targets: unilabos_resources
        result: {}
        schema:
          description: ''
          properties:
            feedback:
              title: LiquidHandlerAdd_Feedback
            goal:
              properties:
                asp_vols:
                  anyOf:
                  - items:
                      type: number
                    type: array
                  - type: number
                blow_out_air_volume:
                  items:
                    type: number
                  type: array
                delays:
                  items:
                    type: integer
                  type: array
                dis_vols:
                  anyOf:
                  - items:
                      type: number
                    type: array
                  - type: number
                flow_rates:
                  items:
                    type: number
                  type: array
                is_96_well:
                  default: false
                  type: boolean
                liquid_height:
                  items:
                    type: number
                  type: array
                mix_liquid_height:
                  type: number
                mix_rate:
                  type: integer
                mix_time:
                  type: integer
                mix_vol:
                  type: integer
                none_keys:
                  default: []
                  items:
                    type: string
                  type: array
                offsets:
                  items:
                    type: object
                  type: array
                reagent_sources:
                  items:
                    type: object
                  type: array
                spread:
                  default: wide
                  enum:
                  - wide
                  - tight
                  - custom
                  type: string
                targets:
                  items:
                    type: object
                  type: array
                touch_tip:
                  default: false
                  type: boolean
                use_channels:
                  items:
                    type: integer
                  type: array
              required:
              - asp_vols
              - dis_vols
              - reagent_sources
              - targets
              title: LiquidHandlerAdd_Goal
              type: object
            result:
              title: LiquidHandlerAdd_Result
          required:
          - goal
          title: add_liquid参数
          type: object
        type: LiquidHandlerAdd
      aspirate:
        error_policy: {}
        feedback: {}
        goal:
          blow_out_air_volume: blow_out_air_volume
          flow_rates: flow_rates
          liquid_height: liquid_height
          offsets: offsets
          resources: resources
          use_channels: use_channels
          vols: vols
        goal_default:
          blow_out_air_volume: []
          flow_rates: []
          liquid_height: []
          offsets: []
          resources: []
          spread: ''
          use_channels: []
          vols: []
        handles: {}
        result:
          name: name
        schema:
          description: ''
          properties:
            feedback:
              additionalProperties: true
              title: LiquidHandlerAspirate_Feedback
              type: object
            goal:
              additionalProperties: false
              properties:
                blow_out_air_volume:
                  items:
                    type: number
                  type: array
                flow_rates:
                  items:
                    type: number
                  type: array
                liquid_height:
                  items:
                    type: number
                  type: array
                offsets:
                  items:
                    properties:
                      x:
                        type: number
                      y:
                        type: number
                      z:
                        type: number
                    required:
                    - x
                    - y
                    - z
                    type: object
                  type: array
                resources:
                  items:
                    properties:
                      category:
                        type: string
                      children:
                        items:
                          type: string
                        type: array
                      config:
                        type: string
                      data:
                        type: string
                      id:
                        type: string
                      name:
                        type: string
                      parent:
                        type: string
                      pose:
                        properties:
                          orientation:
                            properties:
                              w:
                                type: number
                              x:
                                type: number
                              y:
                                type: number
                              z:
                                type: number
                            required:
                            - x
                            - y
                            - z
                            - w
                            title: orientation
                            type: object
                          position:
                            properties:
                              x:
                                type: number
                              y:
                                type: number
                              z:
                                type: number
                            required:
                            - x
                            - y
                            - z
                            title: position
                            type: object
                        required:
                        - position
                        - orientation
                        title: pose
                        type: object
                      sample_id:
                        type: string
                      type:
                        type: string
                    required:
                    - id
                    - name
                    - sample_id
                    - children
                    - parent
                    - type
                    - category
                    - pose
                    - config
                    - data
                    type: object
                  type: array
                spread:
                  type: string
                use_channels:
                  items:
                    type: integer
                  type: array
                vols:
                  items:
                    type: number
                  type: array
              title: LiquidHandlerAspirate_Goal
              type: object
            result:
              additionalProperties: false
              properties:
                return_info:
                  type: string
                success:
                  type: boolean
              title: LiquidHandlerAspirate_Result
              type: object
          required:
          - goal
          title: LiquidHandlerAspirate
          type: object
        type: LiquidHandlerAspirate
      auto-create_protocol:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default:
          none_keys: []
          protocol_author: null
          protocol_date: null
          protocol_description: null
          protocol_name: null
          protocol_type: null
          protocol_version: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 创建实验协议函数。用于建立新的液体处理实验协议，定义协议名称、描述、版本、作者、日期等基本信息。该函数支持协议模板化管理，便于实验流程的标准化和重复性。适用于实验设计、方法开发、标准操作程序建立等需要协议管理的应用场景。
          properties:
            feedback: {}
            goal:
              properties:
                none_keys:
                  default: []
                  items:
                    type: string
                  type: array
                protocol_author:
                  type: string
                protocol_date:
                  type: string
                protocol_description:
                  type: string
                protocol_name:
                  type: string
                protocol_type:
                  type: string
                protocol_version:
                  type: string
              required:
              - protocol_name
              - protocol_description
              - protocol_version
              - protocol_author
              - protocol_date
              - protocol_type
              type: object
            result: {}
          required:
          - goal
          title: create_protocol参数
          type: object
        type: UniLabJsonCommandAsync
      auto-custom_delay:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default:
          msg: null
          seconds: 0
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 自定义延时函数。在实验流程中插入可配置的等待时间，用于满足特定的反应时间、孵育时间或设备稳定时间要求。支持自定义延时消息和秒数设置，提供流程控制和时间管理功能。适用于酶反应等待、温度平衡、样品孵育等需要时间控制的实验步骤。
          properties:
            feedback: {}
            goal:
              properties:
                msg:
                  description: information to be printed
                  type: string
                seconds:
                  default: 0
                  description: seconds to wait
                  type: string
              required: []
              type: object
            result: {}
          required:
          - goal
          title: custom_delay参数
          type: object
        type: UniLabJsonCommandAsync
      auto-iter_tips:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default:
          tip_racks: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 吸头迭代函数。用于自动管理和切换枪头盒中的吸头，实现批量实验中的吸头自动分配和追踪。该函数监控吸头使用状态，自动切换到下一个可用吸头位置，确保实验流程的连续性。适用于高通量实验、批量处理、自动化流水线等需要大量吸头管理的应用场景。
          properties:
            feedback: {}
            goal:
              properties:
                tip_racks:
                  items:
                    type: object
                  type: array
              required:
              - tip_racks
              type: object
            result:
              type: string
          required:
          - goal
          title: iter_tips参数
          type: object
        type: UniLabJsonCommand
      auto-set_group:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default:
          group_name: null
          volumes: null
          wells: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                group_name:
                  type: string
                volumes:
                  items:
                    type: number
                  type: array
                wells:
                  items:
                    type: object
                  type: array
              required:
              - group_name
              - wells
              - volumes
              type: object
            result: {}
          required:
          - goal
          title: set_group参数
          type: object
        type: UniLabJsonCommand
      auto-set_liquid:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default:
          liquid_names: null
          volumes: null
          wells: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: set_liquid的参数schema
          properties:
            feedback: {}
            goal:
              properties:
                liquid_names:
                  items:
                    type: string
                  type: array
                volumes:
                  items:
                    type: number
                  type: array
                wells:
                  items:
                    type: object
                  type: array
              required:
              - wells
              - liquid_names
              - volumes
              type: object
            result:
              $defs:
                JsonValue: {}
                ResourceDict:
                  description: 资源实例的唯一规范快照；运行时树行为留在 ``resource_tracker``。
                  properties:
                    barcode:
                      default: ''
                      description: Material barcode
                      title: Barcode
                      type: string
                    barcode_symbology:
                      default: ''
                      description: Barcode symbology / 码制
                      title: Barcode Symbology
                      type: string
                    class:
                      description: Resource class name
                      title: Class
                      type: string
                    config:
                      additionalProperties: true
                      description: Resource configuration
                      title: Config
                      type: object
                    data:
                      additionalProperties: true
                      description: 'Resource data, eg: container data without liquids,
                        since liquids are tracked separately'
                      title: Data
                      type: object
                    description:
                      default: ''
                      description: Resource description
                      title: Description
                      type: string
                    display_name:
                      default: ''
                      description: Display name; authority falls back to name when
                        empty
                      title: Display Name
                      type: string
                    extra:
                      additionalProperties: true
                      description: Uni-Lab-OS communication and conversion metadata
                      title: Extra
                      type: object
                    icon:
                      default: ''
                      description: Resource icon
                      title: Icon
                      type: string
                    id:
                      description: Resource ID
                      title: Id
                      type: string
                    joint_state:
                      anyOf:
                      - $ref: '#/$defs/ResourceJointState'
                      - type: 'null'
                      default: null
                      description: Frequently changing device joint state; independent
                        from pose
                    liquid_history:
                      anyOf:
                      - items:
                          maxItems: 3
                          minItems: 3
                          prefixItems:
                          - anyOf:
                            - type: string
                            - type: 'null'
                          - type: number
                          - type: string
                          type: array
                        type: array
                      - type: 'null'
                      default: null
                      description: VolumeTracker (liquid_name, delta, unit) event
                        history
                      title: Liquid History
                    machine_name:
                      default: ''
                      description: Machine this resource belongs to
                      title: Machine Name
                      type: string
                    meta_data:
                      additionalProperties:
                        $ref: '#/$defs/JsonValue'
                      description: Canonical resource metadata
                      title: Meta Data
                      type: object
                    model:
                      additionalProperties: true
                      description: Resource model
                      title: Model
                      type: object
                    name:
                      description: Resource name
                      title: Name
                      type: string
                    parent:
                      anyOf:
                      - $ref: '#/$defs/ResourceDict'
                      - type: 'null'
                      default: null
                      description: Parent resource object
                    parent_uuid:
                      anyOf:
                      - type: string
                      - type: 'null'
                      default: null
                      description: Parent resource uuid
                      title: Parent Uuid
                    pose:
                      $ref: '#/$defs/ResourceDictPosition'
                      description: Resource pose relative to its parent, plus geometry/layout
                        metadata
                    resource_template_uuid:
                      default: ''
                      description: Micro-backend ResourceTemplate UUID
                      title: Resource Template Uuid
                      type: string
                    schema:
                      additionalProperties: true
                      description: Resource schema
                      title: Schema
                      type: object
                    sites:
                      anyOf:
                      - items:
                          $ref: '#/$defs/ResourceSite'
                        type: array
                      - type: 'null'
                      default: null
                      description: Carrier site definitions / 载架位点
                      title: Sites
                    sites_initialized:
                      default: false
                      description: Whether site preparation has run for this resource
                        instance
                      title: Sites Initialized
                      type: boolean
                    substances:
                      anyOf:
                      - items:
                          maxItems: 3
                          minItems: 3
                          prefixItems:
                          - type: string
                          - type: number
                          - type: string
                          type: array
                        type: array
                      - type: 'null'
                      default: null
                      description: Current (substance_name, quantity, unit) entries
                      title: Substances
                    template_name:
                      default: ''
                      description: Edge resource template name
                      title: Template Name
                      type: string
                    type:
                      anyOf:
                      - const: device
                        type: string
                      - type: string
                      description: Resource type
                      title: Type
                    unknown_counter:
                      anyOf:
                      - minimum: 0
                        type: integer
                      - type: 'null'
                      default: null
                      description: Unnamed liquid counter
                      title: Unknown Counter
                    uuid:
                      description: Resource UUID
                      title: Uuid
                      type: string
                  required:
                  - id
                  - uuid
                  - name
                  - type
                  - class
                  - config
                  - data
                  - extra
                  title: ResourceDict
                  type: object
                ResourceDictPosition:
                  additionalProperties: false
                  properties:
                    cross_section_type:
                      default: rectangle
                      description: Cross section type
                      enum:
                      - rectangle
                      - circle
                      - rounded_rectangle
                      title: Cross Section Type
                      type: string
                    extra:
                      anyOf:
                      - additionalProperties: true
                        type: object
                      - type: 'null'
                      default: null
                      description: Extra data
                      title: Extra
                    layout:
                      default: x-y
                      description: Resource layout
                      enum:
                      - 2d
                      - x-y
                      - z-y
                      - x-z
                      title: Layout
                      type: string
                    position:
                      anyOf:
                      - $ref: '#/$defs/ResourceDictPositionObject'
                      - type: 'null'
                      default: null
                      description: Actual position relative to the parent resource
                    position3d:
                      $ref: '#/$defs/ResourceDictPositionObject'
                      description: 3D layout/visualization position; not a second
                        runtime position
                    rotation:
                      $ref: '#/$defs/ResourceDictPositionObject'
                      description: Resource rotation
                    scale:
                      $ref: '#/$defs/ResourceDictPositionScale'
                      description: Resource scale
                    size:
                      $ref: '#/$defs/ResourceDictPositionSize'
                      description: Resource size
                  title: ResourceDictPosition
                  type: object
                ResourceDictPositionObject:
                  additionalProperties: false
                  properties:
                    x:
                      description: X coordinate
                      title: X
                      type: number
                    y:
                      description: Y coordinate
                      title: Y
                      type: number
                    z:
                      description: Z coordinate
                      title: Z
                      type: number
                  required:
                  - x
                  - y
                  - z
                  title: ResourceDictPositionObject
                  type: object
                ResourceDictPositionScale:
                  additionalProperties: false
                  properties:
                    x:
                      description: x scale
                      title: X
                      type: number
                    y:
                      description: y scale
                      title: Y
                      type: number
                    z:
                      description: z scale
                      title: Z
                      type: number
                  required:
                  - x
                  - y
                  - z
                  title: ResourceDictPositionScale
                  type: object
                ResourceDictPositionSize:
                  additionalProperties: false
                  properties:
                    depth:
                      description: Depth
                      minimum: 0.0
                      title: Depth
                      type: number
                    height:
                      description: Height
                      minimum: 0.0
                      title: Height
                      type: number
                    width:
                      description: Width
                      minimum: 0.0
                      title: Width
                      type: number
                  required:
                  - depth
                  - width
                  - height
                  title: ResourceDictPositionSize
                  type: object
                ResourceJointState:
                  additionalProperties: false
                  description: 设备关节的瞬时状态；不属于资源在父坐标系中的 ``pose``。
                  properties:
                    effort:
                      description: Joint efforts; empty when unavailable
                      items:
                        type: number
                      title: Effort
                      type: array
                    name:
                      description: Joint names
                      items:
                        type: string
                      title: Name
                      type: array
                    position:
                      description: Joint positions in the joint-defined unit
                      items:
                        type: number
                      title: Position
                      type: array
                    velocity:
                      description: Joint velocities; empty when unavailable
                      items:
                        type: number
                      title: Velocity
                      type: array
                  title: ResourceJointState
                  type: object
                ResourceSite:
                  additionalProperties: false
                  description: 'Edge、微后端和 PLR Adapter 共用的唯一 Site 实例模型。


                    PLR 特有但需要往返保留的字段进入显式 ``extra``；canonical v1 仍拒绝

                    未声明的顶层字段，避免 Adapter 形状反向污染微后端协议。'
                  properties:
                    allowed_resource_categories:
                      description: ResourceTemplate category hints for frontend canvas
                        filtering only; not an Edge/backend mount constraint
                      items:
                        type: string
                      title: Allowed Resource Categories
                      type: array
                    description:
                      default: ''
                      title: Description
                      type: string
                    extra:
                      additionalProperties:
                        $ref: '#/$defs/JsonValue'
                      title: Extra
                      type: object
                    index:
                      anyOf:
                      - type: integer
                      - type: string
                      title: Index
                    label:
                      title: Label
                      type: string
                    material_uuid:
                      title: Material Uuid
                      type: string
                    meta_data:
                      additionalProperties:
                        $ref: '#/$defs/JsonValue'
                      title: Meta Data
                      type: object
                    occupied_material_uuid:
                      anyOf:
                      - type: string
                      - type: 'null'
                      default: null
                      title: Occupied Material Uuid
                    parent_link:
                      default: ''
                      title: Parent Link
                      type: string
                    pose:
                      $ref: '#/$defs/ResourceDictPosition'
                    schema_version:
                      const: 1
                      default: 1
                      title: Schema Version
                      type: integer
                    template_name:
                      title: Template Name
                      type: string
                    uuid:
                      title: Uuid
                      type: string
                    visible:
                      default: true
                      title: Visible
                      type: boolean
                  required:
                  - uuid
                  - template_name
                  - material_uuid
                  - index
                  - label
                  title: ResourceSite
                  type: object
              properties:
                volumes:
                  items:
                    type: number
                  title: Volumes
                  type: array
                wells:
                  items:
                    items:
                      $ref: '#/$defs/ResourceDict'
                    type: array
                  title: Wells
                  type: array
              required:
              - wells
              - volumes
              title: SetLiquidReturn
              type: object
          required:
          - goal
          title: set_liquid参数
          type: object
        type: UniLabJsonCommand
