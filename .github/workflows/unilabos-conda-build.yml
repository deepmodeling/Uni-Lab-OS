name: UniLabOS Conda Build

on:
  # 在 Multi-Platform Conda Build 成功上传 msgs 后自动触发
  workflow_run:
    workflows: ["Multi-Platform Conda Build"]
    types: [completed]
  # 手动触发
  workflow_dispatch:
    inputs:
      source_ref:
        description: '构建源码分支或完整 SHA；工作流定义仍取所选运行分支'
        required: true
        default: 'dev'
        type: string
      platforms:
        description: '选择构建平台 (逗号分隔): linux-64, osx-64, osx-arm64, win-64'
        required: false
        default: 'linux-64'
      ros_distros:
        description: '选择 ROS 2 发行版 (逗号分隔): jazzy, humble'
        required: false
        default: 'jazzy,humble'
      build_full:
        description: '是否构建 unilabos-full 完整包 (默认只构建 unilabos 基础包)'
        required: false
        default: false
        type: boolean
      upload_to_anaconda:
        description: '是否上传到Anaconda.org'
        required: false
        default: false
        type: boolean
      skip_ci_check:
        description: '跳过等待 CI Check (手动触发时可选)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  # 等待上游 msgs 构建完成的 job (仅用于 workflow_run 触发)
  wait-for-upstream:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    outputs:
      should_continue: ${{ steps.check.outputs.should_continue }}
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - name: Check upstream workflow status
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            core.setOutput("should_continue", "false");
            const run = context.payload.workflow_run;
            if (run.conclusion !== "success" || !["release", "push"].includes(run.event)) {
              core.notice("上游并非成功的 release/tag 构建，不启动发布链。");
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            const shas = new Set(artifacts.filter(a => !a.expired)
              .map(a => a.name.match(/^msgs-source-published-([0-9a-f]{40})-(jazzy|humble)-(linux-64|osx-64|osx-arm64|win-64)$/))
              .filter(Boolean).map(match => match[1]));
            if (shas.size !== 1) {
              core.setFailed("上游缺少唯一的已上传源码凭证；不能回退到默认分支 SHA。");
              return;
            }
            core.setOutput("source_sha", [...shas][0]);
            core.setOutput("should_continue", "true");

  build:
    needs: [wait-for-upstream]
    # 运行条件：workflow_run 触发且上游成功，或者手动触发
    if: |
      always() &&
      (needs.wait-for-upstream.result == 'skipped' || needs.wait-for-upstream.outputs.should_continue == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
            ros_distro: jazzy
            ros_channel: robostack-jazzy
            environment_recipe: .conda/environment/recipe.yaml
            base_recipe: .conda/base/recipe.yaml
            full_recipe: .conda/full/recipe.yaml
          - os: macos-15-intel # Intel x86_64
            platform: osx-64
            ros_distro: jazzy
            ros_channel: robostack-jazzy
            environment_recipe: .conda/environment/recipe.yaml
            base_recipe: .conda/base/recipe.yaml
            full_recipe: .conda/full/recipe.yaml
          - os: macos-latest # ARM64
            platform: osx-arm64
            ros_distro: jazzy
            ros_channel: robostack-jazzy
            environment_recipe: .conda/environment/recipe.yaml
            base_recipe: .conda/base/recipe.yaml
            full_recipe: .conda/full/recipe.yaml
          - os: windows-2022
            platform: win-64
            ros_distro: jazzy
            ros_channel: robostack-jazzy
            environment_recipe: .conda/environment/recipe.yaml
            base_recipe: .conda/base/recipe.yaml
            full_recipe: .conda/full/recipe.yaml
          - os: ubuntu-latest
            platform: linux-64
            ros_distro: humble
            ros_channel: robostack-humble
            environment_recipe: .conda/environment-humble/recipe.yaml
            base_recipe: .conda/base-humble/recipe.yaml
            full_recipe: .conda/full-humble/recipe.yaml
          - os: macos-15-intel
            platform: osx-64
            ros_distro: humble
            ros_channel: robostack-humble
            environment_recipe: .conda/environment-humble/recipe.yaml
            base_recipe: .conda/base-humble/recipe.yaml
            full_recipe: .conda/full-humble/recipe.yaml
          - os: macos-latest
            platform: osx-arm64
            ros_distro: humble
            ros_channel: robostack-humble
            environment_recipe: .conda/environment-humble/recipe.yaml
            base_recipe: .conda/base-humble/recipe.yaml
            full_recipe: .conda/full-humble/recipe.yaml
          - os: windows-2022
            platform: win-64
            ros_distro: humble
            ros_channel: robostack-humble
            environment_recipe: .conda/environment-humble/recipe.yaml
            base_recipe: .conda/base-humble/recipe.yaml
            full_recipe: .conda/full-humble/recipe.yaml

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v6
        with:
          # 如果是 workflow_run 触发，使用上游 conda 包构建的 commit
          ref: ${{ needs.wait-for-upstream.outputs.source_sha || inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Check if platform should be built
        id: should_build
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ ( -z "${{ github.event.inputs.platforms }}" || "${{ github.event.inputs.platforms }}" == *"${{ matrix.platform }}"* ) && ( -z "${{ github.event.inputs.ros_distros }}" || "${{ github.event.inputs.ros_distros }}" == *"${{ matrix.ros_distro }}"* ) ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Miniforge
        if: steps.should_build.outputs.should_build == 'true'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: '3.12.13'
          channels: conda-forge,${{ matrix.ros_channel }},uni-lab
          channel-priority: strict
          activate-environment: build-env
          auto-update-conda: false
          show-channel-urls: true

      - name: Install rattler-build and anaconda-client
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmd //D //S //C '%CONDA%\condabin\mamba.bat install -n build-env --override-channels -c conda-forge rattler-build anaconda-client -y'
          else
            mamba install -n build-env --override-channels -c conda-forge rattler-build anaconda-client -y
          fi
          echo "CONDA_NO_PLUGINS=true" >> "$GITHUB_ENV"
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"
          # anaconda-client 1.13+ 的顶层 CLI 不再支持 --version，上传也需使用兼容入口。
          echo "ANACONDA_CLIENT_FORCE_STANDALONE=1" >> "$GITHUB_ENV"

      - name: Show environment info
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          conda info
          conda list -n build-env | grep -E "(rattler-build|anaconda-client)"
          conda run -n build-env rattler-build --version
          conda run -n build-env python -m binstar_client.scripts.cli --version
          echo "Platform: ${{ matrix.platform }}"
          echo "OS: ${{ matrix.os }}"
          echo "ROS distro: ${{ matrix.ros_distro }}"
          echo "Build full package: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_full == 'true' }}"
          echo "Building packages:"
          echo "  - unilabos-env (environment dependencies)"
          echo "  - unilabos (with pip package)"
          if [[ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_full == 'true' }}" == "true" ]]; then
            echo "  - unilabos-full (complete package)"
          fi

      - name: Build unilabos-env (conda environment only, noarch)
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          echo "Building unilabos-env for ${{ matrix.ros_distro }}..."
          conda run -n build-env rattler-build build -r ${{ matrix.environment_recipe }} --target-platform ${{ matrix.platform }} -c uni-lab -c conda-forge -c ${{ matrix.ros_channel }}

      - name: Upload unilabos-env to Anaconda.org (if enabled)
        if: |
          steps.should_build.outputs.should_build == 'true' &&
          matrix.platform == 'linux-64' &&
          (
            github.event_name == 'workflow_run' ||
            github.event.inputs.upload_to_anaconda == 'true'
          )
        run: |
          echo "Uploading unilabos-env to uni-lab organization..."
          for package in $(find ./output -name "unilabos-env*.conda"); do
            conda run -n build-env anaconda -t ${{ secrets.ANACONDA_API_TOKEN }} upload --user uni-lab --force "$package"
          done

      - name: Build unilabos (with pip package)
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          echo "Building unilabos package for ${{ matrix.ros_distro }}..."
          # 如果已上传到 Anaconda，从 uni-lab channel 获取 unilabos-env；否则从本地 output 获取
          conda run -n build-env rattler-build build -r ${{ matrix.base_recipe }} --target-platform ${{ matrix.platform }} -c uni-lab -c conda-forge -c ${{ matrix.ros_channel }} --channel ./output

      - name: Upload unilabos to Anaconda.org (if enabled)
        if: |
          steps.should_build.outputs.should_build == 'true' &&
          (
            github.event_name == 'workflow_run' ||
            github.event.inputs.upload_to_anaconda == 'true'
          )
        run: |
          echo "Uploading unilabos to uni-lab organization..."
          for package in $(find ./output -name "unilabos-0*.conda" -o -name "unilabos-[0-9]*.conda"); do
            conda run -n build-env anaconda -t ${{ secrets.ANACONDA_API_TOKEN }} upload --user uni-lab --force "$package"
          done

      - name: Build unilabos-full - Only when explicitly requested
        if: |
          steps.should_build.outputs.should_build == 'true' && 
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.build_full == 'true'
        run: |
          echo "Building unilabos-full (${{ matrix.ros_distro }}) on ${{ matrix.platform }}..."
          conda run -n build-env rattler-build build -r ${{ matrix.full_recipe }} --target-platform ${{ matrix.platform }} -c uni-lab -c conda-forge -c ${{ matrix.ros_channel }} --channel ./output

      - name: Upload unilabos-full to Anaconda.org (if enabled)
        if: |
          steps.should_build.outputs.should_build == 'true' &&
          matrix.platform == 'linux-64' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.build_full == 'true' &&
          github.event.inputs.upload_to_anaconda == 'true'
        run: |
          echo "Uploading unilabos-full to uni-lab organization..."
          for package in $(find ./output -name "unilabos-full*.conda"); do
            conda run -n build-env anaconda -t ${{ secrets.ANACONDA_API_TOKEN }} upload --user uni-lab --force "$package"
          done

      - name: List built packages
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          echo "Built packages in output directory:"
          find ./output -name "*.conda" | head -10
          ls -la ./output/${{ matrix.platform }}/ || echo "${{ matrix.platform }} directory not found"
          ls -la ./output/noarch/ || echo "noarch directory not found"
          echo "Output directory structure:"
          find ./output -type f -name "*.conda"

      - name: Prepare artifacts for upload
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          mkdir -p conda-packages-temp
          find ./output -name "*.conda" -exec cp {} conda-packages-temp/ \;
          echo "Copied files to temp directory:"
          ls -la conda-packages-temp/

      - name: Upload conda package artifacts
        if: steps.should_build.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: conda-package-unilabos-${{ matrix.ros_distro }}-${{ matrix.platform }}
          path: conda-packages-temp
          if-no-files-found: error
          retention-days: 30

      - name: Record successful source provenance
        id: source
        if: steps.should_build.outputs.should_build == 'true'
        env:
          PUBLISHED: ${{ github.event_name == 'workflow_run' || inputs.upload_to_anaconda == true }}
        run: |
          sha="$(git rev-parse HEAD)"
          state=tested
          if [[ "$PUBLISHED" == "true" ]]; then state=published; fi
          printf '%s\n' "$sha" > source-sha.txt
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Built $sha (${{ matrix.ros_distro }}/${{ matrix.platform }}, $state)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload successful source provenance
        if: steps.should_build.outputs.should_build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unilabos-source-${{ steps.source.outputs.state }}-${{ steps.source.outputs.sha }}-${{ matrix.ros_distro }}-${{ matrix.platform }}
          path: source-sha.txt
          if-no-files-found: error
          retention-days: 30
