        placeholder_keys: {}
        result: {}
        schema:
          description: valve_open的参数schema
          properties:
            feedback: {}
            goal:
              properties:
                condition:
                  description: The condition to be monitored, either 'delta' or 'time'.
                  type: string
                value:
                  description: 'The threshold value for the condition.

                    `delta > 0.05`, `time > 60`'
                  type: string
              required:
              - condition
              - value
              type: object
            result: {}
          required:
          - goal
          title: valve_open参数
          type: object
        type: UniLabJsonCommand
      auto-write:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default:
          data: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: write的参数schema
          properties:
            feedback: {}
            goal:
              properties:
                data:
                  type: string
              required:
              - data
              type: object
            result: {}
          required:
          - goal
          title: write参数
          type: object
        type: UniLabJsonCommand
      stir:
        error_policy: {}
        feedback: {}
        goal:
          event: event
          settling_time: settling_time
          stir_speed: stir_speed
          stir_time: stir_time
          time: time
          time_spec: time_spec
          vessel: vessel
        goal_default:
          settling_time: 10
          stir_speed: 300
          stir_time: 10
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback:
              title: Stir_Feedback
