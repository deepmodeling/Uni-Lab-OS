name: CI Check

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: styxhuang/unilabos-lite:tagname

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show runtime environment
        run: |
          python --version
          which python
          which pip
          which mamba || true
          which uv || true

      - name: Install Uni-Lab-OS in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv pytest
          python -m pip install -e .
          uv pip install --system --no-cache -r unilabos/utils/requirements.txt

      - name: Run tests
        run: |
          python -m pytest \
            tests/resources \
            tests/ros/msgs \
            tests/szlab
