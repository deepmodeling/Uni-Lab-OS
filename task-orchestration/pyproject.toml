[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-orchestration"
version = "0.1.0"
description = "Task orchestration workspace microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/task_orchestration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
