  <text x="72" y="112" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="400" fill="#52647d">CI 不连接真实实验 OPC；通过虚拟 OPC UA 服务和守护进程模拟 PLC 状态推进。</text>
