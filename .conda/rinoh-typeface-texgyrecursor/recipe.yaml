# 保留上游发行包及字体许可；full 集成测试会导入全部字体并执行 pip check。
package:
  name: rinoh-typeface-texgyrecursor
  version: 0.1.1
source:
  url: https://files.pythonhosted.org/packages/68/70/b0a661118e7a93d1abf4375543644b054bb74b258924d62dd898b9860a71/rinoh-typeface-texgyrecursor-0.1.1.tar.gz
  sha256: 076f7dbbd0201b0d44f4c77e4f7070474e1365152dc8509b5cded04c1648308a
build:
  noarch: python
  number: 1
  script: python -m pip install . --no-deps --no-build-isolation
requirements:
  host:
    - python >=3.14,<3.15
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.14,<3.15
    - rinohtype >=0.5.4
tests:
  # 单个字体构建时其余字体尚未构建；这里验证字体数据和入口，full 再验证完整依赖闭环。
  - script:
      - python -c "from importlib.metadata import distribution; d = distribution('rinoh-typeface-texgyrecursor'); assert d.version == '0.1.1'; assert any(str(p).endswith('.otf') and d.locate_file(p).is_file() for p in d.files); assert any(p.group == 'rinoh.typefaces' for p in d.entry_points)"
about:
  homepage: https://github.com/brechtm/rinoh-typeface-texgyrecursor
  license: LicenseRef-GUST-Font-License
  license_file: rinoh_typeface_texgyrecursor/GUST-FONT-LICENSE.txt
  summary: Original texgyrecursor font package for the complete documentation environment
