<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <rect width="1280" height="720" fill="#f8fbff"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#19345f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <text x="72" y="74" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#14213d">SZLab UniLabOS 实践阶段性汇报</text>
  <text x="72" y="108" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="400" fill="#52647d">围绕数据闭环、私有化落地与 UniLabOS 工程能力，形成可交付、可复用、可持续迭代的项目实践</text>
  <g filter="url(#shadow)">
    <rect x="72" y="140" width="1136" height="108" rx="26" fill="#ffffff" stroke="#4f8fd8" stroke-width="2.8"/>
    <rect x="92" y="164" width="116" height="60" rx="20" fill="#e7f1ff"/>
    <text x="150" y="190" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#2c6fba">数据闭环</text>
