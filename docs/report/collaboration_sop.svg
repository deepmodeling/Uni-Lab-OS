<text x="640" y="465" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#14213d">SOP 不是额外流程，而是嵌入 UniLab 的开发、联调、测试和展示链路</text>
