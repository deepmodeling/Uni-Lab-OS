<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img">
  <rect width="1280" height="760" fill="#f8fbff"/>
  <text x="72" y="76" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#14213d">轻量级私有化架构：平台统一入口，服务通过接口接入</text>
  <text x="72" y="112" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#52647d">外部用户通过 Gateway 访问 Polymer Platform；实验设计/记录、设备服务、UniLabOS 和模型服务接入平台；数据与文件进入 MySQL / MinIO。</text>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path d="M0.8,0.8 L5.2,3 L0.8,5.2 Z" fill="#2f5f9f"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#19345f" flood-opacity="0.13"/></filter></defs>
  <rect x="70" y="145" width="1140" height="500" rx="30" fill="#eef5ff" stroke="#b9d2f5" stroke-width="2"/>
