[package]
name = "unilab-grant-policy"
version = "0.2.0"
edition = "2021"
description = "Uni-Lab-OS scheduler grant policy (FIFO over lock sets) behind a small C ABI"
license = "GPL-3.0-only"
publish = false
build = "build.rs"

[lib]
name = "unilab_grant_policy"
crate-type = ["cdylib", "rlib"]

[dependencies]

[build-dependencies]
# 每次编译从 Rust 源码生成 C 头文件 include/unilab_grant_policy.h；Python 绑定再由头文件生成
cbindgen = { version = "0.29", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
