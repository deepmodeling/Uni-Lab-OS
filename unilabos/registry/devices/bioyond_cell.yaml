                    properties:
                      materials:
                        description: 物料列表
                        items:
                          properties:
                            mass:
                              description: 质量(g)
                              type: number
                            name:
                              description: 物料名称
                              type: string
                          required:
                          - name
                          - mass
                          type: object
                        type: array
                      order_name:
                        description: 配方名称（可选）
                        type: string
                    required:
                    - materials
                    type: object
                  type: array
                load_shedding_info:
                  default: 0.0
                  description: 扣电组装分液体积
                  type: number
                mix_time:
                  default: 0
                  description: 混匀时间(秒)
                  type: integer
                pouch_cell_info:
                  default: 0.0
                  description: 软包组装分液体积
                  type: number
