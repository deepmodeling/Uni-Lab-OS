name: CI Check

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: styxhuang/unilabos-lite:1.0


    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show runtime environment
        run: |
          python --version
          which python
          which pip
          which mamba || true
          which uv || true
          which flake8 || true
          which autopep8 || true
          which pre-commit || true

      - name: Install Uni-Lab-OS in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
          uv pip install --system --no-cache -r unilabos/utils/requirements.txt

      - name: Run flake8
        run: |
          python -m flake8 .

      - name: Run tests
        run: |
          python -m pytest tests/szlab
