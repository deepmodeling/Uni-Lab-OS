<text x="695.0" y="372" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#52647d">文件资产索引</text>
    <rect x="925" y="185" width="220" height="110" rx="22" fill="#ffffff" stroke="#f2c879" stroke-width="2.4"/>
<text x="1035.0" y="227" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#14213d">模型服务</text>
