    <rect x="1016" y="304" width="148" height="60" rx="18" fill="#f7fffa" stroke="#9bd9b1" stroke-width="2"/>
    <text x="1090" y="331" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14213d">MySQL / MinIO</text>
    <text x="1090" y="352" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#52647d">数据与文件</text>

    <rect x="72" y="420" width="1136" height="140" rx="26" fill="#ffffff" stroke="#c97700" stroke-width="2.8"/>
    <rect x="92" y="452" width="116" height="72" rx="20" fill="#fff3df"/>
