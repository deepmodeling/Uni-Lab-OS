    <text x="150" y="353" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#25a56a">轻量部署</text>
    <text x="238" y="322" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#14213d">Gateway + Polymer Platform + MySQL / MinIO</text>
    <text x="238" y="354" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#52647d">一套 Docker 组合完成本地部署</text>
    <rect x="862" y="304" width="134" height="60" rx="18" fill="#f7fffa" stroke="#9bd9b1" stroke-width="2"/>
