name: UniLabOS Companion Wheels

on:
  push:
    branches: [dev]
    paths: ['recipes/**', '.conda/pylabrobot/**', 'scripts/*wheel_release.py', 'native/**', 'scripts/build_grant_policy.py', 'scripts/verify_installation.py', 'setup.py', 'pyproject.toml', 'MANIFEST.in', 'unilabos/utils/requirements*.txt', '.github/workflows/wheel-release.yml']
  pull_request:
    branches: [dev]
    paths: ['recipes/**', '.conda/pylabrobot/**', 'scripts/*wheel_release.py', 'native/**', 'scripts/build_grant_policy.py', 'scripts/verify_installation.py', 'setup.py', 'pyproject.toml', 'MANIFEST.in', 'unilabos/utils/requirements*.txt', '.github/workflows/wheel-release.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: '构建源码分支 / SHA；手动构建仅生成附件，不发布'
        type: string
        default: dev

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: windows-2022
            platform: win-64
          - os: macos-15-intel
            platform: osx-64
          - os: macos-latest
            platform: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and verify complete offline wheelhouse outside checkout
        run: python scripts/build_wheel_release.py
      - name: Check release tag against built metadata
        if: github.event_name == 'release'
        run: python -c "import json, os; from pathlib import Path; m=json.loads(Path('dist/wheel-release/manifest.json').read_text()); assert os.environ['RELEASE_TAG'] == 'v'+m['version']; assert m['verified'] and not m['local_test']"
      # 原生锁授予策略库（native/grant-policy）：单独的发布附件，解压到 <working_dir>/native/ 即被加载
      - name: Build the native grant policy bundle
        shell: bash
        run: |
          cargo test --release --locked --lib --manifest-path native/grant-policy/Cargo.toml
          python scripts/build_grant_policy.py --bundle dist --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v6
        with:
          name: unilab-grant-policy-${{ matrix.platform }}
          path: |
            dist/unilab-grant-policy-*.zip
            dist/unilab-grant-policy-*.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v6
        with:
          name: unilabos-wheelhouse-${{ matrix.platform }}
          path: |
            dist/unilabos-*-wheelhouse-*.zip
            dist/unilabos-*-wheelhouse-*.zip.sha256
          if-no-files-found: error
          retention-days: 90

  attach-release:
    needs: build
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: unilabos-wheelhouse-*
          merge-multiple: true
          path: release-wheels
      - uses: actions/download-artifact@v5
        with:
          pattern: unilab-grant-policy-*
          merge-multiple: true
          path: release-wheels
      - name: Attach tested bundles to this release (never PyPI, never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-wheels/*.zip release-wheels/*.sha256
