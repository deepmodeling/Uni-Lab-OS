apiVersion: batch/v1
kind: Job
metadata:
  name: uni-lab-demo-template-sync
  namespace: xiongyanfei
  labels:
    app.kubernetes.io/name: uni-lab-demo-template-sync
    app.kubernetes.io/part-of: uni-lab-demo
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uni-lab-demo-template-sync
        app.kubernetes.io/part-of: uni-lab-demo
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 57439
        runAsGroup: 57439
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: template-sync
          image: uni-lab-demo-edge:manual-confirm-20260803-1
          imagePullPolicy: Never
          args:
            - unilab
            - --config
            - /etc/unilabos/local_config.py
            - --working_dir
            - /work
            - --addr
            - http://uni-lab-demo-backend:8080/api/v1
            - template-sync
          env:
            - name: UNILAB_TEMPLATE_SYNC_DEVELOPER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: uni-lab-demo-secrets
                  key: developer-api-key
            - name: UNILABOS_OTELCONFIG_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://signoz-otel:4317
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: uni-lab-edge-template-sync
            - name: OTEL_SERVICE_VERSION
              value: manual-confirm-20260803-1
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: demo
            - name: OTEL_TRACES_SAMPLER
              value: always_on
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/unilabos
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: config
          configMap:
            name: uni-lab-demo-edge-config
        - name: work
          emptyDir: {}
---
