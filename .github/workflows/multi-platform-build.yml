name: Multi-Platform Conda Build

on:
  # 在 CI Check 工作流完成后触发（仅限 main/dev 分支）
  workflow_run:
    workflows: ["CI Check"]
    types:
      - completed
    branches: [main, dev]
  # 支持 tag 推送（不依赖 CI Check）
  push:
    tags: ['v*']
  # GitHub Release 发布时自动构建并上传
  release:
    types: [published]
  # 手动触发
  workflow_dispatch:
    inputs:
      platforms:
        description: '选择构建平台 (逗号分隔): linux-64, osx-64, osx-arm64, win-64'
        required: false
        default: 'osx-arm64'
      upload_to_anaconda:
        description: '是否上传到Anaconda.org'
        required: false
        default: false
        type: boolean
      skip_ci_check:
        description: '跳过等待 CI Check (手动触发时可选)'
        required: false
        default: false
        type: boolean

jobs:
  # 等待 CI Check 完成的 job (仅用于 workflow_run 触发)
  wait-for-ci:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    outputs:
      should_continue: ${{ steps.check.outputs.should_continue }}
    steps:
      - name: Check CI status
        id: check
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "should_continue=true" >> $GITHUB_OUTPUT
            echo "CI Check passed, proceeding with build"
          else
            echo "should_continue=false" >> $GITHUB_OUTPUT
            echo "CI Check did not succeed (status: ${{ github.event.workflow_run.conclusion }}), skipping build"
          fi

  build:
    needs: [wait-for-ci]
    # 运行条件：workflow_run 触发且 CI 成功，或者其他触发方式
    if: |
      always() &&
      (needs.wait-for-ci.result == 'skipped' || needs.wait-for-ci.outputs.should_continue == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
            env_file: unilabos-linux-64.yaml
          - os: macos-15-intel # Intel x86_64
            platform: osx-64
            env_file: unilabos-osx-64.yaml
          - os: macos-latest # ARM64
            platform: osx-arm64
            env_file: unilabos-osx-arm64.yaml
          - os: windows-2022
            platform: win-64
            env_file: unilabos-win64.yaml

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v6
        with:
          # 如果是 workflow_run 触发，使用触发 CI Check 的 commit
          ref: ${{ github.event.workflow_run.head_sha || github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Check if platform should be built
        id: should_build
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ -z "${{ github.event.inputs.platforms }}" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.platforms }}" == *"${{ matrix.platform }}"* ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Miniforge
        if: steps.should_build.outputs.should_build == 'true'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: '3.12.13'
          channels: conda-forge,robostack-jazzy
          channel-priority: strict
          activate-environment: build-env
          auto-update-conda: false
          show-channel-urls: true

      - name: Install rattler-build and anaconda-client
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmd //D //S //C '%CONDA%\condabin\mamba.bat install -n build-env --override-channels -c conda-forge rattler-build anaconda-client -y'
          else
            mamba install -n build-env --override-channels -c conda-forge rattler-build anaconda-client -y
          fi
          echo "CONDA_NO_PLUGINS=true" >> "$GITHUB_ENV"
          echo "PYTHONUTF8=1" >> "$GITHUB_ENV"
          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"
          # anaconda-client 1.13+ 把 `anaconda` 入口迁移到插件化的 anaconda-cli-base，
          # 新版顶层移除了 `--version`，且会改变 `anaconda upload` 的命名空间。
          # 强制使用独立(standalone)CLI 以恢复完全向后兼容的行为(--version 与 upload 均可用)。
          echo "ANACONDA_CLIENT_FORCE_STANDALONE=1" >> "$GITHUB_ENV"

      - name: Show environment info
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          conda info
          conda list -n build-env | grep -E "(rattler-build|anaconda-client)"
          conda run -n build-env rattler-build --version
          # 用 binstar_client 模块入口查看版本，无论 anaconda CLI 处于 standalone 还是 plugin 模式都可用
          conda run -n build-env python -m binstar_client.scripts.cli --version
          echo "Platform: ${{ matrix.platform }}"
          echo "OS: ${{ matrix.os }}"

      - name: Build conda package
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          conda run -n build-env rattler-build build -r ./recipes/msgs/recipe.yaml --target-platform ${{ matrix.platform }} -c conda-forge -c robostack-jazzy

      - name: List built packages
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          echo "Built packages in output directory:"
          find ./output -name "*.conda" | head -10
          ls -la ./output/${{ matrix.platform }}/ || echo "${{ matrix.platform }} directory not found"
          ls -la ./output/noarch/ || echo "noarch directory not found"
          echo "Output directory structure:"
          find ./output -type f -name "*.conda"

      - name: Prepare artifacts for upload
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          mkdir -p conda-packages-temp
          find ./output -name "*.conda" -exec cp {} conda-packages-temp/ \;
          echo "Copied files to temp directory:"
          ls -la conda-packages-temp/

      - name: Upload conda package artifacts
        if: steps.should_build.outputs.should_build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: conda-package-${{ matrix.platform }}
          path: conda-packages-temp
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to Anaconda.org (unilab organization)
        if: |
          steps.should_build.outputs.should_build == 'true' &&
          (
            github.event_name == 'release' ||
            startsWith(github.ref, 'refs/tags/') ||
            github.event.inputs.upload_to_anaconda == 'true'
          )
        run: |
          for package in $(find ./output -name "*.conda"); do
            echo "Uploading $package to unilab organization..."
            conda run -n build-env anaconda -t ${{ secrets.ANACONDA_API_TOKEN }} upload --user uni-lab --force "$package"
          done
