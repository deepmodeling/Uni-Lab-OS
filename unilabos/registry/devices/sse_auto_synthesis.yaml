                          description: 添加目标温度end_temp和加热时间time_temp
                          items:
                            properties:
                              end_temp:
                                type: number
                              time_temp:
                                type: integer
                            required:
                            - time_temp
                            - end_temp
                            type: object
                          type: array
                      type: object
                    furnace_04:
                      description: 炉子4参数输入
