# 上游为纯 Python SDK；公共 channel 缺 osx-arm64，统一构建 noarch，保留原始源码。
package:
  name: opcua
  version: 0.98.13
source:
  - url: https://files.pythonhosted.org/packages/77/b1/5788cf02d4527ec816998ecd8b066242877f1b1ca6fcc07d7d4c0317fd04/opcua-0.98.13.tar.gz
    sha256: 3352f30b5fed863146a82778aaf09faa5feafcb9dd446a4f49ff34c0c3ebbde6
  # PyPI sdist 漏装许可文件；从同一版本的固定上游提交补入。
  - url: https://raw.githubusercontent.com/FreeOpcUa/python-opcua/bf734dfc00e96b3ba1c184c5f511589fa183166b/COPYING
    sha256: da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768
build:
  noarch: python
  number: 1
  script: python -m pip install . --no-deps --no-build-isolation
  python:
    entry_points:
      - uaread = opcua.tools:uaread
      - uals = opcua.tools:uals
      - uabrowse = opcua.tools:uals
      - uawrite = opcua.tools:uawrite
      - uasubscribe = opcua.tools:uasubscribe
      - uahistoryread = opcua.tools:uahistoryread
      - uaclient = opcua.tools:uaclient
      - uaserver = opcua.tools:uaserver
      - uadiscover = opcua.tools:uadiscover
      - uacall = opcua.tools:uacall
requirements:
  host:
    - python >=3.14,<3.15
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.14,<3.15
    - lxml
    - python-dateutil
    - pytz
    - cryptography
tests:
  - python:
      imports:
        - opcua
      pip_check: true
  - script:
      - uaread --help
about:
  homepage: https://github.com/FreeOpcUa/python-opcua
  license: LGPL-3.0-or-later
  license_file: COPYING
  summary: Pure Python OPC-UA client and server for all supported platforms
