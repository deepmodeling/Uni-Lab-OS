name: CI Check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  registry-check:
    name: registry-check (${{ matrix.ros_distro }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, humble]

    env:
      # Fix Unicode encoding issue on Windows runner (cp1252 -> utf-8)
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
      # 强制 matplotlib 使用无头后端，避免在无显示的 Windows runner 上加载 GUI 后端 DLL 导致原生崩溃
      MPLBACKEND: Agg
      # 原生崩溃(0xC0000005 访问违例)时打印 Python 调用栈，便于定位是哪个设备模块 import 崩溃
      PYTHONFAULTHANDLER: "1"
      ROS_DISTRO: ${{ matrix.ros_distro }}
      ROS_CHANNEL: robostack-${{ matrix.ros_distro }}
      ROS_PACKAGE_PREFIX: ros-${{ matrix.ros_distro }}
      ROS_MUTEX: ${{ matrix.ros_distro == 'jazzy' && '0.15' || '0.9' }}

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: '3.12.13'
          channels: conda-forge,robostack-${{ matrix.ros_distro }}
          channel-priority: strict
          activate-environment: check-env
          auto-update-conda: false
          show-channel-urls: true

      - name: Install ROS 2 ${{ matrix.ros_distro }} dependencies and build tools
        run: |
          echo Installing ROS 2 %ROS_DISTRO% dependencies...
          mamba install -n check-env --override-channels -c conda-forge -c %ROS_CHANNEL% conda-forge::numpy=2 conda-forge::uv conda-forge::opencv conda-forge::colcon-common-extensions %ROS_CHANNEL%::ros2-distro-mutex=%ROS_MUTEX% %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-ros-core %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-action-msgs %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-std-msgs %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-geometry-msgs %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-control-msgs %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-nav2-msgs %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-cv-bridge %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-vision-opencv %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-tf-transformations %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-moveit-msgs %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-tf2-ros %ROS_CHANNEL%::%ROS_PACKAGE_PREFIX%-tf2-ros-py conda-forge::transforms3d -y

      - name: Initialize MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build unilabos_msgs for ${{ matrix.ros_distro }}/cp312
        run: |
          call conda activate check-env
          if /I "%ROS_DISTRO%"=="humble" python -m pip install empy==3.3.4
          set "CMAKE_PYTHON=%CONDA_PREFIX:\=/%/python.exe"
          colcon build --base-paths unilabos_msgs --build-base build\unilabos_msgs --install-base install\unilabos_msgs --merge-install --packages-select unilabos_msgs --cmake-args -DBUILD_TESTING=OFF -DPython3_EXECUTABLE="%CMAKE_PYTHON%"
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          call install\unilabos_msgs\setup.bat
          python -c "import os; from rosidl_generator_py import import_type_support_impl; from unilabos_msgs.msg import Resource; import_type_support_impl.import_type_support('unilabos_msgs'); print('unilabos_msgs ' + os.environ['ROS_DISTRO'] + '/cp312 typesupport: OK')"

      - name: Install pip dependencies and unilabos
        run: |
          call conda activate check-env
          call install\unilabos_msgs\setup.bat
          echo Installing pip dependencies...
          uv pip install -r unilabos/utils/requirements.txt
          uv pip install pywinauto git+https://github.com/Xuwznln/pylabrobot.git@rebase-official-main
          uv pip uninstall enum34 || echo enum34 not installed, skipping
          uv pip install pytest
          uv pip install .

      # README 中列出的六个外部设备示例随主仓库接口一起端到端验证：
      # tests/e2e/readme_demos.py 固定引用六个仓库的已验证提交（示例仓库 CI 反向
      # 固定 Uni-Lab-OS 提交，两侧互相锁定），用例按 pinned 提交克隆源码，再走
      # check_mode -> unilab graph create -> unilab -g 起微后端 -> 管理 API 跑工作流。
      - name: Validate README example device packages end to end
        run: |
          call conda activate check-env
          call install\unilabos_msgs\setup.bat
          echo Running README demo e2e (check_mode, graph CLI, runtime, management API)...
          python -m pytest -q tests\e2e -p no:launch_testing -p no:launch_ros

      - name: Gate HostLink direct and ROS2-assisted networking
        run: |
          call conda activate check-env
          call install\unilabos_msgs\setup.bat
          echo Running HostLink direct backend, microbackend ownership, ROS2 assist and decorator tests...
          python -m pytest -q tests\backend\hostlink tests\networking tests\backend\runtime tests\app\test_backend_selection.py tests\app\test_rclpy_dll_patch.py tests\registry\test_backend_metadata.py tests\backend\ros2\test_action_schema_compat.py tests\backend\ros2\test_domain_init.py tests\backend\ros2\test_device_node_contract.py -p no:launch_testing -p no:launch_ros

      - name: Run check mode (AST registry validation)
        # check_mode 会真实 import 所有设备类(连带 matplotlib/opencv 等原生库)。
        # Windows runner 上偶发原生崩溃(退出码 -1073741819 = 0xC0000005 访问违例)，
        # 这是环境/DLL 层面的 flaky 崩溃，与注册表内容无关，因此对该步做有限次重试。
        # 注意：段错误退出码为负数，必须用 "%ERRORLEVEL% EQU 0" 显式判断，
        # 不能用 "if errorlevel 1"(它对负数退出码会误判为成功)。
        run: |
          call conda activate check-env
          call install\unilabos_msgs\setup.bat
          echo Running check mode...
          set ATTEMPTS=4
          set COUNT=0
          :retry
          set /a COUNT+=1
          echo === Check attempt %COUNT% of %ATTEMPTS% ===
          python -m unilabos --check_mode --skip_env_check
          if %ERRORLEVEL% EQU 0 (
            echo Check passed on attempt %COUNT%
            exit /b 0
          )
          echo Attempt %COUNT% failed with exit code %ERRORLEVEL%
          if %COUNT% LSS %ATTEMPTS% goto retry
          echo All %ATTEMPTS% attempts failed
          exit /b 1

      - name: Check for uncommitted changes
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "::error::检测到文件变化！请先在本地运行 'python -m unilabos --complete_registry' 并提交变更"
            echo "变化的文件:"
            git diff --name-only
            exit 1
          fi
          echo "检查通过：无文件变化"
