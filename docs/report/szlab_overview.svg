    <text x="238" y="182" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#14213d">高分子配方模型 + 定制 ELN</text>
    <text x="238" y="214" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#52647d">配方 - 实验 - 记录 - 结果闭环</text>
    <rect x="862" y="164" width="134" height="60" rx="18" fill="#f7fbff" stroke="#9fc3ff" stroke-width="2"/>
    <text x="929" y="190" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14213d">配方模型</text>
    <text x="929" y="211" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#52647d">结构化生成</text>
    <rect x="1030" y="164" width="134" height="60" rx="18" fill="#f7fbff" stroke="#9fc3ff" stroke-width="2"/>
    <text x="1097" y="190" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14213d">ELN 记录</text>
    <text x="1097" y="211" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#52647d">结果回流</text>

    <rect x="72" y="280" width="1136" height="108" rx="26" fill="#ffffff" stroke="#25a56a" stroke-width="2.8"/>
    <rect x="92" y="304" width="116" height="60" rx="20" fill="#e5f7ed"/>
