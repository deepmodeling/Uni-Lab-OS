AI4M002_station:
  category:
  - AI4M002_station
  class:
    action_value_mappings:
      auto-set_stirrer_params:
        always_free: true
        feedback: {}
        goal: {}
        goal_default:
          heat_temp: null
          station_id: null
          stir_speed: null
          time_set: null
        handles: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                heat_temp:
                  type: integer
                station_id:
                  type: integer
                stir_speed:
                  type: integer
                time_set:
                  type: integer
              required:
              - station_id
              - stir_speed
              - heat_temp
              - time_set
              type: object
            result: {}
          required:
          - goal
          title: set_stirrer_params参数
          type: object
        type: UniLabJsonCommand
      auto-trigger_3axis_pick_from_electrolytic_cell_and_place_to_finished:
        feedback: {}
        goal: {}
        goal_default:
          cleaning_time: null
          electrolytic_cell_id: null
          nitrogen_time: null
          place_code: null
        handles:
          input:
          - data_key: electrolytic_cell_id
            data_source: handle
            data_type: ai4m002_electrolytic_cell
            handler_key: electrolytic_cell_input
            label: 电解池编号
          output:
          - data_key: place_code
            data_source: executor
            data_type: ai4m002_finished_electrode
            handler_key: finished_electrode_output
            label: 完成电极堆栈位置
        placeholder_keys: {}
        result: {}
        schema:
          description: 从电解池取料，夹住到水洗池，放到完成电极
          properties:
            feedback: {}
            goal:
              properties:
                cleaning_time:
                  description: 水洗时间设置
                  type: integer
                electrolytic_cell_id:
                  description: 电解池ID，1或2
                  type: integer
                nitrogen_time:
                  description: 氮气时间设置
                  type: integer
                place_code:
                  description: 完成电极堆栈取放料代码，1-15
                  type: integer
              required:
              - electrolytic_cell_id
              - cleaning_time
              - nitrogen_time
              - place_code
              type: object
            result:
              description: trigger_3axis_pick_from_electrolytic_cell_and_place_to_finished
                返回类型
              properties:
                electrolytic_cell_id:
                  title: Electrolytic Cell Id
                  type: integer
                message:
                  title: Message
                  type: string
                place_code:
                  title: Place Code
                  type: integer
              required:
              - electrolytic_cell_id
              - place_code
              - message
              title: trigger_3axis_pick_from_electrolytic_cell_and_place_to_finished返回结果
              type: object
          required:
          - goal
          title: trigger_3axis_pick_from_electrolytic_cell_and_place_to_finished参数
          type: object
        type: UniLabJsonCommand
      auto-trigger_3axis_pick_from_raw_and_place_to_electrolytic_cell:
        feedback: {}
        goal: {}
        goal_default:
          electrolytic_cell_id: null
          pick_code: null
        handles:
          input:
          - data_key: pick_code
            data_source: handle
            data_type: ai4m002_raw_electrode
            handler_key: raw_electrode_input
            label: 原始电极堆栈位置
          output:
          - data_key: electrolytic_cell_id
            data_source: executor
            data_type: ai4m002_electrolytic_cell
            handler_key: electrolytic_cell_output
            label: 电解池编号
        placeholder_keys: {}
        result: {}
        schema:
          description: 从原始电极取料并放到电解池
          properties:
            feedback: {}
            goal:
              properties:
                electrolytic_cell_id:
                  description: 目标电解池ID，1或2
                  type: integer
                pick_code:
                  description: 原始电极堆栈取放料代码，1-15
                  type: integer
              required:
              - pick_code
              - electrolytic_cell_id
              type: object
            result:
              description: trigger_3axis_pick_from_raw_and_place_to_electrolytic_cell
                返回类型
              properties:
                electrolytic_cell_id:
                  title: Electrolytic Cell Id
                  type: integer
                message:
                  title: Message
                  type: string
                pick_code:
                  title: Pick Code
                  type: integer
              required:
              - pick_code
              - electrolytic_cell_id
              - message
              title: trigger_3axis_pick_from_raw_and_place_to_electrolytic_cell返回结果
              type: object
          required:
          - goal
          title: trigger_3axis_pick_from_raw_and_place_to_electrolytic_cell参数
          type: object
        type: UniLabJsonCommand
      auto-trigger_3axis_pick_from_raw_and_process_to_finished:
        feedback: {}
        goal: {}
        goal_default:
          cleaning_time: null
          nitrogen_time: null
          pick_code: null
          pickling_time: null
          place_code: null
        handles:
          input:
          - data_key: pick_code
            data_source: handle
            data_type: ai4m002_raw_electrode
            handler_key: raw_electrode_input
            label: 原始电极堆栈位置
          output:
          - data_key: place_code
            data_source: executor
            data_type: ai4m002_finished_electrode
            handler_key: finished_electrode_output
            label: 完成电极堆栈位置
        placeholder_keys: {}
        result: {}
        schema:
          description: 从原始电极取料，经酸洗池、水洗池，放到完成电极
          properties:
            feedback: {}
            goal:
              properties:
                cleaning_time:
                  description: 水洗时间设置
                  type: integer
                nitrogen_time:
                  description: 氮气时间设置
                  type: integer
                pick_code:
                  description: 原始电极堆栈取放料代码，1-15
                  type: integer
                pickling_time:
                  description: 酸洗时间设置
                  type: integer
                place_code:
                  description: 完成电极堆栈取放料代码，1-15
                  type: integer
              required:
              - pick_code
              - pickling_time
              - cleaning_time
              - nitrogen_time
              - place_code
              type: object
            result:
              description: trigger_3axis_pick_from_raw_and_process_to_finished 返回类型
              properties:
                message:
                  title: Message
                  type: string
                pick_code:
                  title: Pick Code
                  type: integer
                place_code:
                  title: Place Code
                  type: integer
              required:
              - pick_code
              - place_code
              - message
              title: trigger_3axis_pick_from_raw_and_process_to_finished返回结果
              type: object
          required:
          - goal
          title: trigger_3axis_pick_from_raw_and_process_to_finished参数
          type: object
        type: UniLabJsonCommand
      auto-trigger_electrolytic_cell_bts_reaction:
        always_free: true
        feedback: {}
        goal: {}
        goal_default:
          current: 50.0
          duration_sec: 20
          electrolytic_cell_id: null
        handles:
          input:
          - data_key: electrolytic_cell_id
            data_source: handle
            data_type: ai4m002_electrolytic_cell
            handler_key: electrolytic_cell_input
            label: 电解池编号
          output:
          - data_key: electrolytic_cell_id
            data_source: executor
            data_type: ai4m002_electrolytic_cell
            handler_key: electrolytic_cell_output
            label: 电解池编号
        placeholder_keys: {}
        result: {}
        schema:
          description: 触发电解池BTS反应，通过OPC UA信号与PLC同步加工流程
          properties:
            feedback: {}
            goal:
              properties:
                current:
                  description: 电流（mA）
                  type: number
                duration_sec:
                  description: BTS测试时长（秒）
                  type: integer
                electrolytic_cell_id:
                  description: 电解池编号，1或2
                  type: integer
              required:
              - electrolytic_cell_id
              type: object
            result:
              description: trigger_electrolytic_cell_bts_reaction 返回类型
              properties:
                electrolytic_cell_id:
                  title: Electrolytic Cell Id
                  type: integer
                message:
                  title: Message
                  type: string
              required:
              - electrolytic_cell_id
              - message
              title: trigger_electrolytic_cell_bts_reaction返回结果
              type: object
          required:
          - goal
          title: trigger_electrolytic_cell_bts_reaction参数
          type: object
        type: UniLabJsonCommand
      auto-trigger_s02_init:
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result: {}
          required:
          - goal
          title: trigger_s02_init参数
          type: object
        type: UniLabJsonCommand
    module: unilabos.devices.workstation.AI4M.AI4M002:AI4M002Device
    status_types: {}
    type: python
  config_info: []
  description: ''
  handles: []
  icon: Electrode_Module.jpg
  init_param_schema:
    config:
      properties:
        cache_timeout:
          default: 5.0
          type: number
        csv_path:
          type: string
        deck:
          type: string
        password:
          type: string
        subscription_interval:
          default: 500
          type: integer
        url:
          type: string
        use_subscription:
          default: true
          type: boolean
        username:
          type: string
      required:
      - url
      type: object
    data:
      properties: {}
      required: []
      type: object
  registry_type: device
  version: 1.0.0
