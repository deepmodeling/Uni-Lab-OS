name: UniLabOS Conda Build

on:
  pull_request:
    branches: [dev]
    paths:
      - '.conda/**'
      - 'recipes/**'
      - 'scripts/build_conda_release.py'
      - '.github/workflows/unilabos-conda-build.yml'
      - 'setup.py'
  # 默认发行链与 ROS msgs 脱钩；dev CI 仅构建验证，正式 Release 才自动发布。
  workflow_run:
    workflows: ["CI Check"]
    types: [completed]
    branches: [dev]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: '构建源码分支或完整 SHA'
        required: true
        default: 'dev'
        type: string
      platforms:
        description: '逗号分隔的平台'
        default: 'linux-64,osx-64,osx-arm64,win-64'
        type: string
      ros_distros:
        description: '显式选装 ROS2 (jazzy,humble)；留空仅构建无 ROS 默认包'
        default: ''
        type: string
      build_full:
        description: '额外构建完整运行/文档/开发环境；必须显式选择 ros_distros'
        default: false
        type: boolean
      extensions_only:
        description: '默认包已发布后，仅构建/上传 ROS2 和 full，不重新上传默认包'
        default: false
        type: boolean
      upload_to_anaconda:
        description: '上传新的包坐标，不覆盖已有业务包'
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      should_continue: ${{ steps.source.outputs.should_continue }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Resolve exact source without depending on ROS messages
        id: source
        uses: actions/github-script@v8
        env:
          REQUESTED_REF: ${{ inputs.source_ref || github.event.release.tag_name || github.event.pull_request.head.sha }}
        with:
          script: |
            core.setOutput("should_continue", "false");
            if (context.eventName === "release" && (process.env.REQUESTED_REF || "").startsWith("msgs-v")) return;
            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              if (run.conclusion !== "success" || run.head_branch !== "dev" || run.event !== "push") return;
              if (!/^[0-9a-f]{40}$/.test(run.head_sha)) {
                core.setFailed("CI 未提供有效源码 SHA");
                return;
              }
              core.setOutput("source_sha", run.head_sha);
            } else {
              const {data: commit} = await github.rest.repos.getCommit({
                ...context.repo, ref: process.env.REQUESTED_REF
              });
              core.setOutput("source_sha", commit.sha);
            }
            core.setOutput("should_continue", "true");

  build:
    needs: resolve-source
    if: needs.resolve-source.outputs.should_continue == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: macos-15-intel
            platform: osx-64
          - os: macos-latest
            platform: osx-arm64
          - os: windows-2022
            platform: win-64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    env:
      ROS_DISTROS: ${{ github.event_name == 'pull_request' && 'jazzy,humble' || inputs.ros_distros }}
      BUILD_FULL: ${{ github.event_name == 'pull_request' || inputs.build_full == true }}
      EXTENSIONS_ONLY: ${{ inputs.extensions_only == true }}
      PYTHONUTF8: '1'
      ANACONDA_CLIENT_FORCE_STANDALONE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
      - name: Check if platform should be built
        id: should_build
        env:
          PLATFORMS: ${{ inputs.platforms }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ -z "$PLATFORMS" || ",$PLATFORMS," == *",$PLATFORM,"* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: conda-incubator/setup-miniconda@v4
        if: steps.should_build.outputs.should_build == 'true'
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: '3.14.10'
          channels: conda-forge
          channel-priority: strict
          activate-environment: build-env
          auto-update-conda: false
      - name: Install build tools
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmd //D //S //C '%CONDA%\condabin\mamba.bat install -n build-env --override-channels -c conda-forge rattler-build anaconda-client -y'
          else
            mamba install -n build-env --override-channels -c conda-forge rattler-build anaconda-client -y
          fi
          echo "CONDA_NO_PLUGINS=true" >> "$GITHUB_ENV"
      - name: Build and test packages
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          extra=()
          if [[ "$BUILD_FULL" == "true" ]]; then extra+=(--full); fi
          if [[ "$EXTENSIONS_ONLY" == "true" ]]; then extra+=(--extensions-only); fi
          python scripts/build_conda_release.py build --platform "${{ matrix.platform }}" --ros-distros "$ROS_DISTROS" --output-dir "$RUNNER_TEMP/c" "${extra[@]}"
      - name: Upload packages after successful tests
        if: steps.should_build.outputs.should_build == 'true' && (github.event_name == 'release' || inputs.upload_to_anaconda == true)
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          extra=()
          if [[ "$BUILD_FULL" == "true" ]]; then extra+=(--full); fi
          if [[ "$EXTENSIONS_ONLY" == "true" ]]; then extra+=(--extensions-only); fi
          python scripts/build_conda_release.py upload --platform "${{ matrix.platform }}" --ros-distros "$ROS_DISTROS" --output-dir "$RUNNER_TEMP/c" "${extra[@]}"
      - uses: actions/upload-artifact@v6
        if: steps.should_build.outputs.should_build == 'true'
        with:
          name: conda-package-unilabos-hostlink-${{ matrix.platform }}
          path: conda-artifacts/
          if-no-files-found: error
      - name: Record successful source provenance
        id: source
        if: steps.should_build.outputs.should_build == 'true' && env.EXTENSIONS_ONLY != 'true'
        env:
          PUBLISHED: ${{ github.event_name == 'release' || inputs.upload_to_anaconda == true }}
        run: |
          sha="$(git rev-parse HEAD)"
          state=tested
          if [[ "$PUBLISHED" == "true" ]]; then state=published; fi
          printf '%s\n' "$sha" > source-sha.txt
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Upload successful source provenance
        if: steps.should_build.outputs.should_build == 'true' && env.EXTENSIONS_ONLY != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unilabos-source-${{ steps.source.outputs.state }}-${{ steps.source.outputs.sha }}-hostlink-${{ matrix.platform }}
          path: source-sha.txt
          if-no-files-found: error
