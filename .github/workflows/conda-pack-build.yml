name: Build Conda-Pack Environment

on:
  workflow_run:
    workflows: ["UniLabOS Conda Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: '构建并打包此源码的无 ROS 默认发行版'
        required: true
        default: 'dev'
        type: string
      platforms:
        description: '逗号分隔的平台'
        default: 'linux-64,osx-64,osx-arm64,win-64'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      should_continue: ${{ steps.source.outputs.should_continue }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      platforms: ${{ steps.source.outputs.platforms }}
    steps:
      - name: Resolve the source that was actually built and uploaded
        id: source
        uses: actions/github-script@v8
        env:
          REQUESTED_REF: ${{ inputs.branch }}
          PLATFORMS: ${{ inputs.platforms }}
        with:
          script: |
            core.setOutput("should_continue", "false");
            if (context.eventName === "workflow_dispatch") {
              const {data: commit} = await github.rest.repos.getCommit({
                ...context.repo, ref: process.env.REQUESTED_REF
              });
              core.setOutput("source_sha", commit.sha);
              core.setOutput("platforms", process.env.PLATFORMS || "linux-64,osx-64,osx-arm64,win-64");
              core.setOutput("should_continue", "true");
              return;
            }
            const run = context.payload.workflow_run;
            if (run.conclusion !== "success") return;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            const proofs = artifacts.filter(a => !a.expired)
              .map(a => a.name.match(/^unilabos-source-published-([0-9a-f]{40})-hostlink-(linux-64|osx-64|osx-arm64|win-64)$/))
              .filter(Boolean);
            const shas = new Set(proofs.map(match => match[1]));
            if (shas.size === 0) {
              core.notice("上游没有无 ROS 默认包的上传凭证，不打包。");
              return;
            }
            if (shas.size !== 1) {
              core.setFailed("上游源码凭证不一致。");
              return;
            }
            core.setOutput("source_sha", [...shas][0]);
            core.setOutput("platforms", [...new Set(proofs.map(match => match[2]))].join(","));
            core.setOutput("should_continue", "true");

  build-conda-pack:
    needs: resolve-source
    if: needs.resolve-source.outputs.should_continue == 'true'
    env:
      PACKAGE_REF: ${{ needs.resolve-source.outputs.source_sha }}
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: macos-15-intel
            platform: osx-64
          - os: macos-latest
            platform: osx-arm64
          - os: windows-2022
            platform: win-64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Check if platform should be built
        id: should_build
        env:
          PLATFORMS: ${{ needs.resolve-source.outputs.platforms }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ ",$PLATFORMS," == *",$PLATFORM,"* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.should_build.outputs.should_build == 'true'
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
      - uses: conda-incubator/setup-miniconda@v4
        if: steps.should_build.outputs.should_build == 'true'
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: '3.14.10'
          channels: conda-forge
          channel-priority: strict
          activate-environment: build-env
          auto-update-conda: false
      - name: Install build and index tools
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmd //D //S //C '%CONDA%\condabin\mamba.bat install -n build-env --override-channels -c conda-forge rattler-build conda-index -y'
          else
            mamba install -n build-env --override-channels -c conda-forge rattler-build conda-index -y
          fi
      - name: Download the exact upstream packages
        if: steps.should_build.outputs.should_build == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: conda-package-unilabos-hostlink-${{ matrix.platform }}
          path: conda-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Build exact source for a manual bundle
        if: steps.should_build.outputs.should_build == 'true' && github.event_name == 'workflow_dispatch'
        run: python scripts/build_conda_release.py build --platform "${{ matrix.platform }}"
      - name: Install, verify and pack the ROS-free environment
        if: steps.should_build.outputs.should_build == 'true'
        run: |
          python scripts/pack_conda_release.py --platform "${{ matrix.platform }}" --source-sha "$PACKAGE_REF" --prefix "${{ runner.temp }}/unilab-bundle"
      - uses: actions/upload-artifact@v6
        if: steps.should_build.outputs.should_build == 'true'
        with:
          name: unilab-pack-hostlink-${{ matrix.platform }}-${{ env.PACKAGE_REF }}
          path: dist-package/
          if-no-files-found: error
          retention-days: 90
