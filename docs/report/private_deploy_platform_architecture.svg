<text x="400.0" y="372" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#14213d">Gateway</text>
<text x="400.0" y="404" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#52647d">统一入口</text>
<text x="400.0" y="428" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#52647d">访问边界</text>
