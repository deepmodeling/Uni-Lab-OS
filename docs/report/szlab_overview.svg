    <text x="150" y="506" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#c97700">UniLabOS 绑定</text>
    <text x="238" y="462" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#14213d">协作 SOP + 虚拟 OPC CI + 本地联调工作台</text>
    <text x="238" y="494" text-anchor="start" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#52647d">标准动作、虚拟验证、可视化联调</text>
