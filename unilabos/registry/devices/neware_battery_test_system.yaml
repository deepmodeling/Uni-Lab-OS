neware_battery_test_system:
  available_sites: []
  category:
  - neware_battery_test_system
  - neware
  - battery_test
  class:
    action_value_mappings:
      auto-print_status_summary:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result: {}
          required:
          - goal
          title: print_status_summary参数
          type: object
        type: UniLabJsonCommand
      auto-test_connection:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              type: boolean
          required:
          - goal
          title: test_connection参数
          type: object
        type: UniLabJsonCommand
      debug_resource_names:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 调试方法：显示所有资源的实际名称
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: debug_resource_names参数
          type: object
        type: UniLabJsonCommand
      export_status_json:
        error_policy: {}
        feedback: {}
        goal:
          filepath: filepath
        goal_default:
          filepath: bts_status.json
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 导出当前状态数据到JSON文件
          properties:
            feedback: {}
            goal:
              properties:
                filepath:
                  default: bts_status.json
                  description: 输出文件路径
                  type: string
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: export_status_json参数
          type: object
        type: UniLabJsonCommand
      get_device_summary:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        result:
          return_info: return_info
          success: success
        schema:
          description: 获取设备级别的摘要统计信息
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              properties:
                return_info:
                  description: 设备摘要信息JSON格式
                  type: string
                success:
                  description: 查询是否成功
                  type: boolean
              required:
              - return_info
              - success
              type: object
          required:
          - goal
          type: object
        type: UniLabJsonCommand
      get_plate_status:
        error_policy: {}
        feedback: {}
        goal:
          plate_num: plate_num
        goal_default:
          plate_num: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 获取指定盘或所有盘的状态信息
          properties:
            feedback: {}
            goal:
              properties:
                plate_num:
                  description: 盘号 (1 或 2)，如果为None则返回所有盘的状态
                  type: integer
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: get_plate_status参数
          type: object
        type: UniLabJsonCommand
      print_status_summary_action:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 打印通道状态摘要信息到控制台
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: print_status_summary_action参数
          type: object
        type: UniLabJsonCommand
      query_plate_action:
        error_policy: {}
        feedback: {}
        goal:
          plate_id: plate_id
          string: string
        goal_default:
          string: ''
        handles: {}
        placeholder_keys: {}
        result:
          return_info: return_info
          success: success
        schema:
          description: ''
          properties:
            feedback:
              additionalProperties: true
              title: StrSingleInput_Feedback
              type: object
            goal:
              additionalProperties: false
              properties:
                string:
                  type: string
              title: StrSingleInput_Goal
              type: object
            result:
              additionalProperties: false
              properties:
                return_info:
                  type: string
                success:
                  type: boolean
              title: StrSingleInput_Result
              type: object
          required:
          - goal
          title: StrSingleInput
          type: object
        type: StrSingleInput
      submit_from_csv:
        error_policy: {}
        feedback: {}
        goal:
          csv_path: string
          output_dir: string
        goal_default:
          csv_path: null
          output_dir: .
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 从CSV文件批量提交Neware测试任务
          properties:
            feedback: {}
            goal:
              properties:
                csv_path:
                  description: 输入CSV文件路径
                  type: string
                output_dir:
                  default: .
                  description: 输出目录，用于存储XML文件和备份，默认当前目录
                  type: string
              required:
              - csv_path
              type: object
            result:
              type: object
          required:
          - goal
          title: submit_from_csv参数
          type: object
        type: UniLabJsonCommand
      test_connection_action:
        error_policy: {}
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 测试与电池测试系统的TCP连接
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: test_connection_action参数
          type: object
        type: UniLabJsonCommand
      upload_backup_to_oss:
        error_policy: {}
        feedback: {}
        goal:
          backup_dir: backup_dir
          file_pattern: file_pattern
          oss_prefix: oss_prefix
        goal_default:
          backup_dir: null
          file_pattern: '*'
          oss_prefix: null
        handles:
          output:
          - data_key: uploaded_files
            data_source: executor
            data_type: array
            handler_key: uploaded_files
            io_type: sink
            label: Uploaded Files (with standard flow info)
        placeholder_keys: {}
        result: {}
        schema:
          description: 上传备份文件到阿里云OSS
          properties:
            feedback: {}
            goal:
              properties:
                backup_dir:
                  description: 备份目录路径，默认使用最近一次 submit_from_csv 的 backup_dir
                  type: string
                file_pattern:
                  default: '*'
                  description: 文件通配符模式，默认 "*" 上传所有文件（例如 "*.csv" 仅上传 CSV 文件）
                  type: string
                oss_prefix:
                  description: OSS 对象前缀，默认使用类初始化时的配置
                  type: string
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: upload_backup_to_oss参数
          type: object
        type: UniLabJsonCommand
    module: unilabos.devices.neware_battery_test_system.neware_battery_test_system:NewareBatteryTestSystem
    status_policies: {}
    status_types:
      channel_status: Dict[int, Dict]
      connection_info: Dict[str, str]
      device_summary: dict
      status: str
      total_channels: int
    supported_backends:
    - hostlink
    - ros2
    type: python
  config_info: []
  description: 新威电池测试系统驱动，提供720个通道的电池测试状态监控、物料管理和CSV批量提交功能。支持TCP通信实现远程控制，包含完整的物料管理系统（2盘电池状态映射），以及从CSV文件批量提交测试任务的能力。
  displayname: neware_battery_test_system
  handles: []
  icon: ''
  init_param_enforce: {}
  init_param_schema:
    config:
      properties:
        devtype:
          description: 设备类型标识
          type: string
        ip:
          description: TCP服务器IP地址
          type: string
        machine_id:
          default: 1
          description: 机器ID
          type: integer
        oss_prefix:
          default: neware_backup
          description: OSS对象路径前缀，默认"neware_backup"
          type: string
        oss_upload_enabled:
          default: false
          description: 是否启用OSS上传功能，默认False
          type: boolean
        port:
          description: TCP端口
          type: integer
        size_x:
          default: 50
          type: number
        size_y:
          default: 50
          type: number
        size_z:
          default: 20
          type: number
        timeout:
          description: 通信超时时间（秒）
          type: integer
      required: []
      type: object
    data:
      properties:
        channel_status:
          additionalProperties:
            type: object
          type: object
        connection_info:
          additionalProperties:
            type: string
          type: object
        device_summary:
          type: object
        status:
          type: string
        total_channels:
          type: integer
      required:
      - channel_status
      - connection_info
      - device_summary
      - status
      - total_channels
      type: object
  version: 1.0.0
