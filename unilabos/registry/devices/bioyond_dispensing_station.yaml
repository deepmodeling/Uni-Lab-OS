      scheduler_start:
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 启动调度器 - 启动Bioyond配液站的任务调度器，开始执行队列中的任务
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              title: scheduler_start结果
              type: object
          required:
          - goal
          title: scheduler_start参数
          type: object
