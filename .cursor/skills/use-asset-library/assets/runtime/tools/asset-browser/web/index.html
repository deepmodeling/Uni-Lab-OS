<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniLab · 机械资产目录</title><link rel="stylesheet" href="/style.css"></head><body>
<aside class="sidebar"><a class="brand" href="/"><span class="mark">U</span><span>UniLab<small>ENGINEERING LIBRARY</small></span></a><div class="side-heading">资产库</div><nav id="categories"></nav><div class="side-heading">按厂家</div><nav id="makers"></nav><section id="supplier-tree" hidden><div class="side-heading">厂家原始分类</div><nav id="supplier-folders"></nav></section><nav id="collections" hidden aria-hidden="true"></nav><div class="side-bottom"><span class="dot"></span> 本地优先 · OSS 按需下载<small id="root-label"></small></div></aside>
<main><header><div><div class="eyebrow">MECHANICAL DESIGN</div><h1>机械资产目录<span id="total">—</span></h1><p>从零件到机构，让设计从可复用的资产开始。</p></div><div class="header-actions"><a class="button secondary" href="http://127.0.0.1:8766/">设备广场 · 分类与场景</a><a class="button secondary" href="/downloads/unilab_asset_browser.zip">↓ Blender 插件</a><button id="sync" class="button primary">↻ 同步目录</button></div></header>
<section class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索部件、型号或关键词…" aria-label="搜索资产"><kbd> / </kbd></label><select id="source-type" aria-label="来源类型"><option value="all">来源类型 · 全部</option></select><select id="availability" aria-label="本地状态"><option value="all">所有状态</option><option value="local">本地可用</option><option value="remote">可从 OSS 下载</option><option value="damaged">需要检查</option><option value="source_only">仅原件（未转换）</option></select><button id="reset" class="button quiet">清除筛选</button></section>
<div class="section-title"><div><h2 id="section-name">所有资产</h2><span id="count"></span></div><span class="hint">缩略图来自真实几何 · 固定版本</span></div>
<nav class="pagination" aria-label="资产分页"><button id="page-prev" class="button secondary">上一页</button><span id="page-status" role="status" aria-live="polite"></span><button id="page-next" class="button secondary">下一页</button></nav>
<div id="grid" class="grid" aria-label="资产列表"></div><div id="empty" class="empty" hidden><strong>没有找到匹配资产</strong><p>试试其他关键词，或清除筛选条件。</p></div>
<nav class="pagination" aria-label="资产分页（页尾）"><button id="page-prev-bottom" class="button secondary">上一页</button><span id="page-status-bottom" role="status"></span><button id="page-next-bottom" class="button secondary">下一页</button></nav>
<footer><span>CAD · USD · OS graph</span><span>厂家与规格缺少依据时保留未知；布局预览不代表物理验证。</span></footer></main>
<aside id="detail" class="detail" hidden><button id="close-detail" class="close" aria-label="关闭详情">×</button><div class="detail-visual"><img id="detail-img" alt="资产预览"></div><div class="detail-body"><div id="detail-kind" class="eyebrow"></div><h2 id="detail-title"></h2><p id="detail-summary"></p><dl id="detail-fields"></dl><div id="qualification" class="qualification"></div><button id="read-readiness" class="button secondary full">Sim-Ready 逐项验收</button><button id="prepare" class="button primary full">准备到本地</button><button id="read-document" class="button secondary full" hidden>阅读资料</button><button id="read-notes" class="button secondary full" hidden>转换与额外属性</button><button id="copy-reference" class="button quiet full">复制固定引用</button><div id="asset-location" class="asset-location"></div><div class="usage-note">在 Blender 的「UniLab」面板点选缩略图即可插入。重复插入生成独立实例，源资产保持不变。</div></div></aside>
<dialog id="readiness-dialog"><div class="dialog-head"><h2 id="readiness-title">逐项验收</h2><button id="close-readiness" class="close" aria-label="关闭验收表">×</button></div><p id="readiness-scope"></p><pre id="readiness-binding"></pre><div id="readiness-groups" aria-live="polite"></div></dialog><dialog id="document-dialog"><div class="dialog-head"><h2 id="document-title"></h2><button id="close-document" class="close">×</button></div><pre id="document-text"></pre></dialog><div id="toast" role="status" hidden></div><script src="/app.js"></script></body></html>
