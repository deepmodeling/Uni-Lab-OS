    <text x="772" y="526" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#52647d">action 标准</text>
    <rect x="872" y="484" width="128" height="52" rx="16" fill="#fbfaff" stroke="#c8b9ff" stroke-width="2"/>
    <text x="936" y="507" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#14213d">CI 验证</text>
    <text x="936" y="526" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#52647d">虚拟 OPC</text>
    <rect x="1036" y="484" width="128" height="52" rx="16" fill="#fffafa" stroke="#ffb3ad" stroke-width="2"/>
    <text x="1100" y="507" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#14213d">联调工作台</text>
    <text x="1100" y="526" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#52647d">可视化调试</text>

    <rect x="150" y="620" width="980" height="56" rx="20" fill="#14213d"/>
    <text x="640" y="655" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#ffffff">阶段成果：从项目交付，沉淀为 UniLabOS 可复制的工程实践能力</text>
