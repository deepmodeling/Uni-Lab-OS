  --bh-color-popover: var(--bh-color-primary-white);
  --bh-color-popover-foreground: var(--bh-color-text-default);

  --bh-color-accent-foreground: var(--bh-color-text-default);
  --bh-color-destructive: var(--bh-color-error-default);

<style>
/*
 * Lab-OS 语义变量 · 建立在 @unilab/design-v2 的 --bh-* 之上
 * 引入顺序：antd reset → design-v2 core.css → themes/default.css → adapters/antd.css → 本文件
 * 规则：业务 CSS 只能引用 --bh-* 与 --lab-*，不写裸色值。
 * 深浅色：这里只引用 --bh-* 别名，颜色模式由 design-v2 的 data-color-mode 决定；
 *         状态文字色是本文件唯一直接给值的地方，因为 Bohrium 状态主色作为文字对比度不足。
 */
:root {
  /* ---------- 布局常量（玻尔 sidebar-shell / sider.tsx / theme.scss） ---------- */
  --lab-sidebar-width: 226px;        /* 玻尔 sider.tsx shrinkWidth expand */
  --lab-sidebar-width-collapsed: 54px;
  --lab-shell-gap: 8px;              /* 内容卡与窗口边距（左侧 4px） */
  --lab-topbar-height: 52px;         /* 玻尔 $header-height */
  --lab-mobile-boundary: 760px;      /* 玻尔 $mobile-boundary */
  --lab-page-padding: 24px;
  --lab-card-gap: 16px;
  --lab-inspector-width: 360px;      /* 右侧检查器 / 实验记录栏 */
  --lab-drawer-width: 480px;

  /* ---------- 控件尺寸 ---------- */
  --lab-control-height: 36px;        /* 玻尔 controlHeight */
  --lab-control-height-sm: 30px;     /* 玻尔 controlHeightSM：表格工具栏、行内操作 */
  --lab-control-height-lg: 40px;     /* 玻尔 controlHeightLG */
  --lab-table-row-height: 44px;
  --lab-table-header-height: 40px;
  --lab-nav-item-height: 36px;

  /* ---------- 形状（取自玻尔 global.scss --border-radius* ） ---------- */
  --lab-radius-sm: 4px;              /* 标签、小按钮 */
  --lab-radius-control: 8px;         /* 按钮、输入、下拉项：玻尔 --border-radius */
  --lab-radius-panel: 8px;           /* 内容卡里的分区面板、侧栏项 */
  --lab-radius-card: 16px;           /* 页面内容卡、抽屉：玻尔 --border-radius-lgx */
  --lab-radius-overlay: 20px;        /* 弹窗、气泡：玻尔 --border-radius-lgxx / Popover 20 */
  --lab-radius-pill: 999px;          /* Tab 切换、筛选、搜索、推荐项 */
  --lab-shadow-overlay: 0 4px 10px rgba(159, 186, 220, 0.2);   /* 玻尔 --box-shadow */
  --lab-shadow-thumb: 0 2px 6px rgba(0, 0, 0, 0.06);           /* 胶囊滑块 */
  --lab-focus-ring: 0 0 0 2px var(--bh-color-ring);

  /* ---------- 表面 ----------
   * 玻尔结构：窗口底 = 侧栏色；主内容是一张白色圆角 16 的内容卡；卡内分区用 fill 面板。
   */
  --lab-window: var(--bh-color-sidebar);            /* 窗口底 = 侧栏底 #f7fafe */
  --lab-surface: var(--bh-color-card);              /* 内容卡、控件 */
  --lab-panel: var(--bh-color-fill-0);              /* 卡内分区面板底 #f7f8fa */
  --lab-surface-muted: var(--bh-color-fill-1);      /* 表头、hover、胶囊底 */
  --lab-button-primary: var(--bh-color-primary);    /* 主按钮：B 端深势蓝；想贴 C 端黑色改这里为 #020c1a */
  --lab-border: var(--bh-color-border);             /* border-1 */
  --lab-border-strong: var(--bh-color-border-2);
  --lab-selection-bg: var(--bh-color-primary-background);
  --lab-selection-border: var(--bh-color-primary);  /* 选中条 2px */

  /* ---------- 文本 ---------- */
  /* 字体：玻尔 AntD 主题 PingFang SC 优先、无 Inter。作为别名传给 AntD fontFamily，不改 --bh-font-family-sans。 */
  --lab-font-family-sans: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
    'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  --lab-text: var(--bh-color-foreground);
  --lab-text-secondary: var(--bh-color-text-description);
  --lab-text-placeholder: var(--bh-color-text-placeholder);
  --lab-text-disabled: var(--bh-color-text-disabled);
  --lab-font-mono: var(--bh-font-family-mono);

  /* ---------- 状态语义（五类，固定，不得混用） ----------
   * running  运行中 / 执行中            → 蓝（主色系）
   * waiting  等待 / 待确认 / 待核对 / 已暂停 → 琥珀
   * success  成功 / 已完成 / 可用        → 绿
   * failed   失败 / 异常 / 已超时 / 受阻  → 红
   * idle     未开始 / 已取消 / 离线 / 不可调度 → 灰
   * dot = 圆点与图标色；bg = 标签底色；text = 标签文字色
   */
  --lab-status-running-dot: var(--bh-color-primary);
  --lab-status-running-bg: var(--bh-color-primary-background);
  --lab-status-running-text: #2f37b7;

  --lab-status-waiting-dot: var(--bh-color-warning-default);
  --lab-status-waiting-bg: var(--bh-color-warning-subtle);
  --lab-status-waiting-text: #8a4b00;

  --lab-status-success-dot: var(--bh-color-success-default);
  --lab-status-success-bg: var(--bh-color-success-subtle);
  --lab-status-success-text: #087a48;

  --lab-status-failed-dot: var(--bh-color-error-default);
  --lab-status-failed-bg: var(--bh-color-error-subtle);
  --lab-status-failed-text: #c42828;

  --lab-status-idle-dot: var(--bh-color-border-3);
  --lab-status-idle-bg: var(--bh-color-fill-1);
  --lab-status-idle-text: var(--bh-color-text-description);

  /* ---------- 调试模式 ---------- */
  --lab-debug-strip-bg: var(--bh-color-warning-subtle);
  --lab-debug-strip-text: #8a4b00;
  --lab-debug-strip-border: var(--bh-color-warning-default);

  /* ---------- 动效 ---------- */
  --lab-motion-fast: 120ms;
  --lab-motion-base: 150ms;
  --lab-motion-toast: 200ms;
}

/* 玻尔科学空间没有深色模式；以下仅为 design-v2 深色取值下的可读性兜底，不作为首版验收项。 */
:root[data-color-mode='dark'] {
  --lab-status-running-text: #c2d4ff;
  --lab-status-waiting-text: #ffd59a;
  --lab-status-success-text: #9fe3bf;
  --lab-status-failed-text: #ffb3b3;
  --lab-debug-strip-text: #ffd59a;
  --lab-shadow-overlay: 0 8px 24px rgba(0, 0, 0, 0.45);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --lab-motion-fast: 0ms;
    --lab-motion-base: 0ms;
    --lab-motion-toast: 0ms;
  }
}

</style>
<style>
/* 设备接入概览（2026-10-26 合并版）：能力范围三卡 + 设备点亮地图。
   支持接入设备地图的标签悬停出提示卡，点击进入设备类型二级页（device-type.html）看插画和型号列表。状态只用主色深浅。 */

/* 点亮地图 · 周期表式等格布局 + 侧边固定详情卡。状态只用主色深浅。 */
:root {
  --st-verified: var(--bh-color-primary);
  --st-compatible: color-mix(in srgb, var(--bh-color-primary) 30%, var(--lab-surface)); /* 2026-10-26 由 48% 调浅：深字更清楚，且与已验证的深色拉开 */
  --st-unknown: var(--lab-surface);
  --st-unknown-border: var(--bh-color-border-2);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: var(--lab-font-family-sans); font-size: 14px; line-height: 22px; color: var(--lab-text); background: var(--lab-window); }
.mono { font-family: var(--lab-font-mono); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 36px 24px 80px; }
.note { font-size: 12px; color: var(--lab-text-secondary); margin: 0 0 20px; }
h1 { font-size: 20px; line-height: 32px; font-weight: 600; margin: 0; }
.meta { font-size: 12px; line-height: 20px; color: var(--lab-text-secondary); margin: 2px 0 20px; }
h2 { font-size: 16px; line-height: 26px; font-weight: 500; margin: 32px 0 4px; }
.sub { font-size: 13px; color: var(--lab-text-secondary); margin: 0 0 14px; }


/* 工具栏 */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--lab-text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .cap { color: var(--lab-text-placeholder); }
.sw { width: 18px; height: 10px; border-radius: 3px; border: 1px solid transparent; display: inline-block; flex: none; }
.sw-verified { background: var(--st-verified); } .sw-compatible { background: var(--st-compatible); } .sw-unknown { background: var(--st-unknown); border-color: var(--st-unknown-border); }
.sw-sim { width: 10px; height: 10px; border-radius: 50%; background: var(--lab-surface); border: 2px solid var(--bh-color-primary); }
.toolbar .sp { flex: 1; }
.select { height: var(--lab-control-height-sm); padding: 0 12px; border-radius: var(--lab-radius-pill); border: 1px solid var(--lab-border); background: var(--lab-surface); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--lab-text-secondary); }
.select.is-active { color: var(--bh-color-primary); border-color: var(--bh-color-primary-border); background: var(--bh-color-primary-background); }
.select select { border: 0; background: none; font: inherit; color: inherit; outline: 0; cursor: pointer; }
.toolbar .link { color: var(--bh-color-primary); cursor: pointer; font-size: 13px; }
.toolbar .count { font-size: 12px; color: var(--lab-text-secondary); white-space: nowrap; }

.layout { display: block; }
.table { background: var(--lab-surface); border: 1px solid var(--lab-border); border-radius: var(--lab-radius-card); padding: 8px 16px 12px; }

/* 悬停提示卡：贴着被悬停的标签出现，点击标签进入二级页 */
.tip { position: absolute; z-index: 20; width: 320px; background: var(--lab-surface); border: 1px solid var(--lab-border); border-radius: var(--lab-radius-overlay); box-shadow: var(--lab-shadow-overlay); padding: 14px 16px; display: none; pointer-events: none; }
.tip.show { display: block; }
.tip h3 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
.tip .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; margin: 2px 0 8px; color: var(--lab-text-secondary); }
.tip .row2 { font-size: 12px; color: var(--lab-text-secondary); line-height: 18px; }
.tip .devs-h { margin: 12px 0 4px; padding-top: 8px; border-top: 1px solid var(--bh-color-border-0); font-size: 12px; color: var(--lab-text-secondary); }
.tip .dev { padding: 8px 10px; border-radius: var(--lab-radius-sm); background: var(--lab-panel); margin-top: 6px; border-left: 3px solid var(--st-verified); }
.tip .dev.compatible { border-left-color: var(--st-compatible); }
.tip .dev.unconnected { border-left-color: var(--st-unknown-border); }
.tip .dev b { font-size: 13px; font-weight: 500; display: block; }
.tip .dev span { display: block; font-size: 12px; color: var(--lab-text-secondary); }
.foot-note { font-size: 12px; color: var(--lab-text-placeholder); margin-top: 24px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: 1fr 1fr; } .row { grid-template-columns: 1fr; } }
.dev .para { display: block; margin-top: 3px; } .dev .para i { font-style: normal; display: inline-block; font-size: 11px; line-height: 16px; padding: 0 5px; margin: 0 4px 2px 0; border: 1px dashed var(--bh-color-border-2); border-radius: var(--lab-radius-sm); color: var(--lab-text-placeholder); }

.dev { display: flex; gap: 10px; align-items: flex-start; }
.dev-img { width: 56px; height: 44px; object-fit: contain; border-radius: var(--lab-radius-sm); background: var(--lab-surface); flex: none; }
.dev-body { min-width: 0; flex: 1; }
.dev.sample { border-left-color: var(--bh-color-border-2); background: transparent; border: 1px dashed var(--bh-color-border-0); border-left: 3px solid var(--bh-color-border-2); }
.dev .vendor { font-size: 12px; color: var(--lab-text-secondary); line-height: 18px; margin-bottom: 2px; }
.dev .kv { display: flex; gap: 8px; font-size: 12px; line-height: 18px; color: var(--lab-text); }
.dev .kv span { color: var(--lab-text-placeholder); flex: none; width: 52px; display: inline; }

/* 阶段 × 学科 的表格：列是六个阶段，行是学科，格子里是设备类型名的小标签 */
.table { padding: 0; overflow: auto; }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0; }
table.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--lab-text); color: #fff; font-size: 13px; font-weight: 600; text-align: center; padding: 10px 8px; }
table.grid thead th.corner { text-align: left; font-weight: 500; font-size: 12px; color: rgba(255,255,255,.75); min-width: 110px; }
table.grid thead th.col em { display: block; font-style: normal; font-family: var(--lab-font-mono); font-size: 10px; font-weight: 400; opacity: .7; line-height: 12px; }
table.grid thead th.col small { display: block; font-size: 10px; font-weight: 400; opacity: .7; line-height: 14px; }
table.grid th.dom { text-align: left; vertical-align: top; padding: 12px 12px; font-size: 14px; font-weight: 600; background: var(--lab-panel); border-top: 1px solid var(--bh-color-border-0); white-space: nowrap; }
table.grid th.dom i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
table.grid th.dom small { display: block; font-size: 11px; font-weight: 400; color: var(--lab-text-secondary); margin-top: 2px; }
table.grid td { vertical-align: top; padding: 8px 6px; border-top: 1px solid var(--bh-color-border-0); border-left: 1px solid var(--bh-color-border-0); min-width: 118px; width: 16%; }
.chip { display: block; margin: 0 0 5px; padding: 4px 8px; border-radius: 6px; font-size: 12px; line-height: 16px; cursor: pointer; border: 1px solid transparent; transition: opacity var(--lab-motion-base); }
.chip.verified { background: var(--st-verified); color: #fff; }
.chip.compatible { background: var(--st-compatible); color: var(--lab-text); }
.chip.unknown { background: var(--st-unknown); border-color: var(--st-unknown-border); color: var(--lab-text-secondary); }
.chip.dim { opacity: .18; }
.chip.more { background: transparent; border: 1px dashed var(--bh-color-border-2); color: var(--bh-color-primary); text-align: center; }
.chip.more:hover { outline: 0; border-style: solid; border-color: var(--bh-color-primary-border); background: var(--bh-color-primary-background); }
.chip:hover, .chip.is-sel { outline: 2px solid var(--lab-text); outline-offset: -1px; }

.search { height: var(--lab-control-height-sm); padding: 0 12px; border-radius: var(--lab-radius-pill); background: color-mix(in srgb, var(--bh-color-fill-1) 50%, transparent); border: 1px solid var(--lab-border); display: inline-flex; align-items: center; gap: 6px; min-width: 220px; font-size: 13px; }
.search input { border: 0; background: none; outline: 0; font: inherit; color: var(--lab-text); width: 100%; }
.search input::placeholder { color: var(--lab-text-placeholder); }

a.chip { text-decoration: none; display: block; }
.chip.unknown { color: var(--lab-text-secondary); }


/* ---- 能力范围（来自设备清单版） ---- */
/* 能力范围 */
.scope { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 16px; margin-top: 20px; }
.scard { background: var(--lab-surface); border: 1px solid var(--lab-border); border-radius: var(--lab-radius-card); padding: 18px 20px 16px; }
.scard h3 { margin: 0 0 12px; font-size: 16px; line-height: 26px; font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; }
.scard h3 b { font-size: 24px; font-weight: 600; color: var(--bh-color-primary); font-family: var(--lab-font-mono); }
.scope-list { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.scope-list div { display: flex; gap: 8px; align-items: flex-start; line-height: 20px; }
.scope-list i { width: 6px; height: 6px; border-radius: 50%; background: var(--bh-color-primary); margin-top: 7px; flex: none; }
.scope-list b { font-family: var(--lab-font-mono); font-weight: 600; color: var(--bh-color-primary); }
.scope-list .dim { color: var(--lab-text-secondary); }
.scard .foot { margin: 12px 0 0; padding-top: 10px; border-top: 1px dashed var(--bh-color-border-0); font-size: 12px; color: var(--lab-text-placeholder); }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar { display: grid; grid-template-columns: 96px 1fr 32px; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; border-radius: var(--lab-radius-sm); padding: 1px 4px; margin: 0 -4px; }
.bar:hover { background: var(--lab-panel); }
.bar.is-cur { background: var(--bh-color-primary-background); }
.bar .lbl { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .lbl i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.bar .lbl em { font-style: normal; font-family: var(--lab-font-mono); font-size: 11px; color: var(--lab-text-placeholder); width: 18px; }
.bar .trk { height: 8px; border-radius: 4px; background: var(--bh-color-fill-1); overflow: hidden; }
.bar .trk b { display: block; height: 100%; border-radius: 4px; background: var(--bh-color-primary); opacity: .85; transition: width .4s; }
.bar .num { font-family: var(--lab-font-mono); font-size: 13px; text-align: right; color: var(--lab-text-secondary); }
.bar.is-cur .num { color: var(--lab-text); font-weight: 600; }
.scope { margin-top: 20px; }
.scard .foot a { color: var(--bh-color-primary); text-decoration: none; }
.scope-list .st-line { display: flex; gap: 10px; flex-wrap: wrap; }
.scope-list .st-line span { display: inline-flex; align-items: center; gap: 6px; }

/* ---- 页尾（来自设备清单版） ---- */
.btn { height: var(--lab-control-height); padding: 0 16px; border-radius: var(--lab-radius-control); border: 1px solid var(--lab-border); background: var(--lab-surface); color: var(--lab-text); font: inherit; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--lab-button-primary); border-color: var(--lab-button-primary); color: #fff; }
.cta { margin-top: 48px; background: var(--lab-surface); border: 1px solid var(--lab-border); border-radius: var(--lab-radius-card); padding: 24px 32px; display: flex; align-items: center; gap: 24px; }
.cta b { font-size: 16px; display: block; }
.cta p { margin: 2px 0 0; color: var(--lab-text-secondary); font-size: 13px; }
.cta .sp { flex: 1; }
.foot-note { font-size: 12px; color: var(--lab-text-placeholder); margin-top: 24px; }

/* 页尾：生态邀请卡 */
.cta { align-items: flex-start; }
.cta > div:first-child { max-width: 680px; }
.cta p.biz { margin-top: 10px; color: var(--lab-text-secondary); }
.cta p.biz a { color: var(--bh-color-primary); text-decoration: none; }
.cta-actions { display: flex; gap: 8px; flex: none; align-self: center; }
@media (max-width: 1000px) { .cta { flex-direction: column; } .cta-actions { align-self: flex-start; } }
/* 合并版覆盖：地图区块标题与清单版一致；标签可点击进入二级页 */
h2 { margin-top: 44px; }
.chip { cursor: pointer; }
.bar.static { cursor: default; }
.bar.static:hover { background: transparent; }
