package:
  name: opentrons-shared-data
  version: 10.1.0+unilabos.np2.1

source:
  url: https://files.pythonhosted.org/packages/ec/ee/3be5b3ca1ca76f81a260bb8cd7f462ba9fe4280d09be8fa68c7ce2017cfe/opentrons_shared_data-10.1.0.tar.gz
  sha256: f289085d053a5e2aa2128bce66ff57e9137926cae09649466c7c5a6685ea4418
  patches:
  - numpy2.patch

build:
  noarch: python
  string: py314_np2_1
  script:
  - python -m pip install . --no-deps --no-build-isolation -vv
  - if: win
    then:
    - if not exist "%PREFIX%\share\licenses\opentrons-shared-data" mkdir "%PREFIX%\share\licenses\opentrons-shared-data"
    - copy LICENSE "%PREFIX%\share\licenses\opentrons-shared-data\LICENSE"
    - copy "%RECIPE_DIR%\NOTICE" "%PREFIX%\share\licenses\opentrons-shared-data\NOTICE"
    else:
    - mkdir -p "$PREFIX/share/licenses/opentrons-shared-data"
    - cp LICENSE "$PREFIX/share/licenses/opentrons-shared-data/LICENSE"
    - cp "$RECIPE_DIR/NOTICE" "$PREFIX/share/licenses/opentrons-shared-data/NOTICE"

requirements:
  host:
  - python ==3.14.10
  - pip
  - hatchling ==1.27.0
  run:
  - python >=3.14,<3.15
  - numpy >=2,<3
  - jsonschema >=4.0.0,<5
  - typing_extensions >=4.0.0,<5
  - pydantic >=2.0.0,<3.0.0

tests:
- python:
    imports:
    - opentrons_shared_data
    - opentrons_shared_data.labware.labware_definition
    pip_check: true
    python_version: 3.14.*
- script:
  - python -c "import importlib.metadata as m; import numpy as np; from opentrons_shared_data.labware import labware_definition as ld; assert int(np.__version__.split('.')[0]) == 2; assert ld.trapezoid([1, 2, 3]) == 4; assert m.version('opentrons-shared-data') == '10.1.0+unilabos.np2.1'"
  - python -c "from opentrons_shared_data.labware import list_definitions, load_definition; from opentrons_shared_data.labware.labware_definition import labware_definition_type_adapter; definitions = list_definitions(); assert {2, 3} <= {s for _, _, s in definitions}; [labware_definition_type_adapter.validate_python(load_definition(n, v, schema=s)) for n, v, s in definitions]; print('Validated labware definitions:', len(definitions))"
  - python -c "import numpy as np; from opentrons_shared_data.labware.labware_definition import SquaredConeSegment; from opentrons_shared_data.labware.constants import Circular; segment = SquaredConeSegment(shape='squaredcone', bottomCrossSection=Circular, circleDiameter=2.0, rectangleXDimension=2.0, rectangleYDimension=2.0, topHeight=0.1, bottomHeight=0.0); table = segment.height_to_volume_table; values = list(table.values()); assert all(np.isfinite(values)); assert all(a <= b for a, b in zip(values, values[1:])); assert 0.3 < table[0.1] < 0.41, table[0.1]"
- package_contents:
    files:
    - share/licenses/opentrons-shared-data/LICENSE
    - share/licenses/opentrons-shared-data/NOTICE

about:
  homepage: https://github.com/Opentrons/opentrons
  repository: https://github.com/Opentrons/opentrons
  license: Apache-2.0
  license_file: LICENSE
  description: "Unofficial UniLabOS NumPy 2 compatibility build of Opentrons shared data. Not affiliated with or endorsed by Opentrons."
