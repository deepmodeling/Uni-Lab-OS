name: CI Check

on:
  push:
    branches:
      - dev
      - feat/hm
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: styxhuang/unilabos-lite:1.0


    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show runtime environment
        run: |
          mamba run -n unilab python --version
          mamba run -n unilab python -c "import sys; print(sys.executable)"
          mamba run -n unilab python -m pip --version
          which mamba || true
          which uv || true
          which flake8 || true
          which autopep8 || true
          which pre-commit || true

      - name: Install Uni-Lab-OS in editable mode
        run: |
          mamba run -n unilab python -m pip install --upgrade pip
          mamba run -n unilab python -m pip install pytest
          mamba run -n unilab python -m pip install -e .
          mamba run -n unilab python -m pip install -r unilabos/utils/requirements.txt

      - name: Run flake8
        run: |
          mamba run -n unilab python -m flake8 .

      - name: Run tests
        run: |
          mamba run -n unilab python -m pytest tests

      - name: Run SZLab mixer pump OPC UA integration test
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${GITHUB_WORKSPACE:-$PWD}"
          VIRTUAL_MIXER_LOG="${RUNNER_TEMP:-/tmp}/virtual_mixer_opcua.log"
          PUMP_DAEMON_LOG="${RUNNER_TEMP:-/tmp}/szlab_mixer_pump_daemon.log"
          VIRTUAL_MIXER_CSV="${WORKSPACE}/tests/szlab/fixtures/szlab_mixer_pump_ci_nodes.csv"
          PUMP_DAEMON_FLOW="${WORKSPACE}/tests/psuedo_devices/szlab_mixer/pump_flow.json"
          OPCUA_SERVER_SCRIPT="${WORKSPACE}/tests/psuedo_devices/common/opcua_csv_server.py"
          OPCUA_DAEMON_SCRIPT="${WORKSPACE}/tests/psuedo_devices/common/opcua_flow_daemon.py"
          VIRTUAL_MIXER_PID=""
          PUMP_DAEMON_PID=""

          echo "Starting virtual mixer OPC UA server"
          echo "Script: ${OPCUA_SERVER_SCRIPT}"
          echo "CSV: ${VIRTUAL_MIXER_CSV}"
          echo "Endpoint: opc.tcp://localhost:50101/"

          mamba run -n unilab python -u "${OPCUA_SERVER_SCRIPT}" \
            --host 0.0.0.0 \
            --port 50101 \
            --path / \
            --csv "${VIRTUAL_MIXER_CSV}" \
            --object-name "VirtualMixer" \
            --initial-values-json '{"S06允许加工": true}' \
            --log-level DEBUG \
            >"${VIRTUAL_MIXER_LOG}" 2>&1 &
          VIRTUAL_MIXER_PID=$!

          cleanup() {
            exit_status=$?
            if [ -n "${PUMP_DAEMON_PID}" ] && kill -0 "${PUMP_DAEMON_PID}" 2>/dev/null; then
              kill "${PUMP_DAEMON_PID}" 2>/dev/null || true
              wait "${PUMP_DAEMON_PID}" 2>/dev/null || true
            fi
            if [ -n "${VIRTUAL_MIXER_PID}" ] && kill -0 "${VIRTUAL_MIXER_PID}" 2>/dev/null; then
              kill "${VIRTUAL_MIXER_PID}" 2>/dev/null || true
              wait "${VIRTUAL_MIXER_PID}" 2>/dev/null || true
            fi
            echo "---- virtual mixer OPC UA log ----"
            if [ -f "${VIRTUAL_MIXER_LOG}" ]; then
              python -c 'import sys; from pathlib import Path; print(Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace"))' "${VIRTUAL_MIXER_LOG}"
            else
              echo "Log file not found: ${VIRTUAL_MIXER_LOG}"
            fi
            echo "---- szlab mixer pump daemon log ----"
            if [ -f "${PUMP_DAEMON_LOG}" ]; then
              python -c 'import sys; from pathlib import Path; print(Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace"))' "${PUMP_DAEMON_LOG}"
            else
              echo "Log file not found: ${PUMP_DAEMON_LOG}"
            fi
            exit "${exit_status}"
          }
          trap cleanup EXIT

          sleep 1
          if ! kill -0 "${VIRTUAL_MIXER_PID}" 2>/dev/null; then
            echo "Virtual mixer OPC UA server exited before tests"
            exit 1
          fi

          echo "---- szlab mixer pump flow summary ----"
          mamba run -n unilab python "${OPCUA_DAEMON_SCRIPT}" \
            --flow "${PUMP_DAEMON_FLOW}" \
            --describe-only

          echo "Starting szlab mixer pump daemon"
          echo "Script: ${OPCUA_DAEMON_SCRIPT}"
          echo "Flow: ${PUMP_DAEMON_FLOW}"
          mamba run -n unilab python -u "${OPCUA_DAEMON_SCRIPT}" \
            --url "opc.tcp://localhost:50101/" \
            --object-name "VirtualMixer" \
            --flow "${PUMP_DAEMON_FLOW}" \
            --poll-interval 0.02 \
            --log-level DEBUG \
            >"${PUMP_DAEMON_LOG}" 2>&1 &
          PUMP_DAEMON_PID=$!

          sleep 1
          if ! kill -0 "${PUMP_DAEMON_PID}" 2>/dev/null; then
            echo "SZLab mixer pump daemon exited before tests"
            exit 1
          fi

          UNILABOS_TEST_SZLAB_MIXER_OPCUA_URL="opc.tcp://localhost:50101/" \
            mamba run -n unilab python -m pytest \
              tests/szlab/test_szlab_mixer_pump_opcua_ci.py \
              -q -s -o log_cli=true --log-cli-level=INFO

      - name: Run AI4C robot arm OPC UA integration test
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${GITHUB_WORKSPACE:-$PWD}"
          AI4C_OPCUA_URL="opc.tcp://localhost:50103/"
          AI4C_CSV="${WORKSPACE}/tests/szlab/fixtures/ai4c_robot_arm_ci_nodes.csv"
          AI4C_ACTION_FLOW="${WORKSPACE}/tests/psuedo_devices/ai4c_robot_arm/pick_place_flow.json"
          AI4C_DAEMON_FLOW="${WORKSPACE}/tests/psuedo_devices/ai4c_robot_arm/opcua_daemon_flow.json"
          OPCUA_SERVER_SCRIPT="${WORKSPACE}/tests/psuedo_devices/common/opcua_csv_server.py"
          OPCUA_DAEMON_SCRIPT="${WORKSPACE}/tests/psuedo_devices/common/opcua_flow_daemon.py"
          AI4C_SERVER_LOG="${RUNNER_TEMP:-/tmp}/ai4c_robot_arm_opcua.log"
          AI4C_DAEMON_LOG="${RUNNER_TEMP:-/tmp}/ai4c_robot_arm_daemon.log"
          AI4C_SERVER_PID=""
          AI4C_DAEMON_PID=""

          echo "Starting AI4C robot arm OPC UA server"
          echo "Script: ${OPCUA_SERVER_SCRIPT}"
          echo "Endpoint: ${AI4C_OPCUA_URL}"
          echo "CSV: ${AI4C_CSV}"
          mamba run -n unilab python -u "${OPCUA_SERVER_SCRIPT}" \
            --host 0.0.0.0 \
            --port 50103 \
            --path / \
            --csv "${AI4C_CSV}" \
            --object-name "AI4C" \
            --name-column Name \
            --data-type-column DataType \
            --node-id-column NodeId \
            --initial-values-json '{"机械臂空闲": true, "机械臂动作完成": false, "机械臂动作触发": false, "孔板上料架_InPut[0]": true, "移液站占位": false}' \
            --log-level DEBUG \
            >"${AI4C_SERVER_LOG}" 2>&1 &
          AI4C_SERVER_PID=$!

          cleanup_ai4c() {
            exit_status=$?
            if [ -n "${AI4C_DAEMON_PID}" ] && kill -0 "${AI4C_DAEMON_PID}" 2>/dev/null; then
              kill "${AI4C_DAEMON_PID}" 2>/dev/null || true
              wait "${AI4C_DAEMON_PID}" 2>/dev/null || true
            fi
            if [ -n "${AI4C_SERVER_PID}" ] && kill -0 "${AI4C_SERVER_PID}" 2>/dev/null; then
              kill "${AI4C_SERVER_PID}" 2>/dev/null || true
              wait "${AI4C_SERVER_PID}" 2>/dev/null || true
            fi
            echo "---- AI4C robot arm OPC UA log ----"
            if [ -f "${AI4C_SERVER_LOG}" ]; then
              python -c 'import sys; from pathlib import Path; print(Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace"))' "${AI4C_SERVER_LOG}"
            else
              echo "Log file not found: ${AI4C_SERVER_LOG}"
            fi
            echo "---- AI4C robot arm daemon log ----"
            if [ -f "${AI4C_DAEMON_LOG}" ]; then
              python -c 'import sys; from pathlib import Path; print(Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace"))' "${AI4C_DAEMON_LOG}"
            else
              echo "Log file not found: ${AI4C_DAEMON_LOG}"
            fi
            exit "${exit_status}"
          }
          trap cleanup_ai4c EXIT

          sleep 1
          if ! kill -0 "${AI4C_SERVER_PID}" 2>/dev/null; then
            echo "AI4C OPC UA server exited before tests"
            exit 1
          fi

          echo "---- AI4C robot arm action flow summary ----"
          mamba run -n unilab python -c 'import json, sys; flow = json.load(open(sys.argv[1], encoding="utf-8")); print("Flow:", flow.get("name")); [print("Action {index}: {node} | {device_id}.{method}({params})".format(**item["action"])) for rule in flow.get("rules", []) for item in rule.get("actions", [])]' "${AI4C_ACTION_FLOW}"

          echo "---- AI4C robot arm daemon flow summary ----"
          mamba run -n unilab python "${OPCUA_DAEMON_SCRIPT}" \
            --flow "${AI4C_DAEMON_FLOW}" \
            --describe-only

          echo "Starting AI4C robot arm daemon"
          echo "Script: ${OPCUA_DAEMON_SCRIPT}"
          echo "Flow: ${AI4C_DAEMON_FLOW}"
          mamba run -n unilab python -u "${OPCUA_DAEMON_SCRIPT}" \
            --url "${AI4C_OPCUA_URL}" \
            --object-name "AI4C" \
            --flow "${AI4C_DAEMON_FLOW}" \
            --poll-interval 0.02 \
            --log-level DEBUG \
            >"${AI4C_DAEMON_LOG}" 2>&1 &
          AI4C_DAEMON_PID=$!

          sleep 1
          if ! kill -0 "${AI4C_DAEMON_PID}" 2>/dev/null; then
            echo "AI4C robot arm daemon exited before tests"
            exit 1
          fi

          UNILABOS_TEST_AI4C_OPCUA_URL="${AI4C_OPCUA_URL}" \
            mamba run -n unilab python -m pytest \
              tests/szlab/test_ai4c_robot_arm_opcua_ci.py \
              -q -s -o log_cli=true --log-cli-level=INFO
