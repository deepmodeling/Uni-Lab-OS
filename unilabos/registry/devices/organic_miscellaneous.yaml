  description: 旋转蒸发仪设备，用于有机化学实验中的溶剂回收和浓缩操作。该设备通过串口通信控制，集成旋转和真空泵功能，支持定时控制和自动化操作。具备旋转速度调节、真空度控制、温度管理等功能，实现高效的溶剂蒸发和回收。适用于有机合成、天然产物提取、药物制备等需要溶剂去除和浓缩的实验室应用场景。
  display_name: 旋转蒸发仪
  handles: []
  icon: ''
  init_param_enforce: {}
  init_param_schema:
    config:
      properties:
        port:
          type: string
        rate:
          default: 9600
          type: string
      required:
      - port
      type: object
    data:
      properties: {}
      required: []
      type: object
  version: 1.0.0
