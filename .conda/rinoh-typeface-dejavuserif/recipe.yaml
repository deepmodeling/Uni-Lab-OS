# 保留上游发行包及字体许可；full 集成测试会导入全部字体并执行 pip check。
package:
  name: rinoh-typeface-dejavuserif
  version: 0.1.3
source:
  url: https://files.pythonhosted.org/packages/ca/d1/e221568b41d6205356ffa6340dcee02acf86d92dec5e5b04798c141b3472/rinoh-typeface-dejavuserif-0.1.3.tar.gz
  sha256: 8be129230ac98ab2ebfbf5b570575052ba7069e4087ce36a2d4c1d85182833ce
build:
  noarch: python
  number: 1
  script: python -m pip install . --no-deps --no-build-isolation
requirements:
  host:
    - python >=3.14,<3.15
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.14,<3.15
    - rinohtype >=0.5.4
tests:
  # 单个字体构建时其余字体尚未构建；这里验证字体数据和入口，full 再验证完整依赖闭环。
  - script:
      - python -c "from importlib.metadata import distribution; d = distribution('rinoh-typeface-dejavuserif'); assert d.version == '0.1.3'; assert any(str(p).endswith('.ttf') and d.locate_file(p).is_file() for p in d.files); assert any(p.group == 'rinoh.typefaces' for p in d.entry_points)"
about:
  homepage: https://github.com/brechtm/rinoh-typeface-dejavuserif
  license: LicenseRef-DejaVu
  license_file: rinoh_typeface_dejavuserif/LICENSE
  summary: Original dejavuserif font package for the complete documentation environment
