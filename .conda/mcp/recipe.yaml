# conda-forge 的 1.x 尚无 1.30；保留既有安全基线，不降低版本或跳到不兼容的 2.x。
package:
  name: mcp
  version: 1.30.0
source:
  url: https://files.pythonhosted.org/packages/ba/93/0142dc84a666daf8ad51a34268f34c12fd6fda4f3810c4be2504eecc8212/mcp-1.30.0.tar.gz
  sha256: 445414625fce5c295faa505bb11bacece661ab6f4028d57c935db57820b7a3e4
build:
  number: 0
  string: py314_0
  script: python -m pip install . --no-deps --no-build-isolation
requirements:
  host:
    - python >=3.14,<3.15
    - pip
    - hatchling
    - uv-dynamic-versioning
  run:
    - python >=3.14,<3.15
    - anyio >=4.5
    - httpx-sse >=0.4
    - httpx >=0.27.1,<1
    - jsonschema >=4.20
    - pydantic-settings >=2.5.2
    - pydantic >=2.11,<3
    - pyjwt >=2.10.1
    - cryptography
    - python-multipart >=0.0.9
    - if: win
      then: pywin32 >=310
    - sse-starlette >=1.6.1
    - starlette >=0.27
    - typing_extensions >=4.9
    - typing-inspection >=0.4.1
    - uvicorn >=0.31.1
tests:
  - python:
      imports:
        - mcp.server.streamable_http_manager
        - mcp.server.transport_security
about:
  license: MIT
  license_file: LICENSE
  summary: Model Context Protocol SDK, maintained 1.x line for UniLabOS
