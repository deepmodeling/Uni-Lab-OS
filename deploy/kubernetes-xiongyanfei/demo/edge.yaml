apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uni-lab-demo-edge-data
  namespace: xiongyanfei
  labels:
    app.kubernetes.io/name: uni-lab-demo-edge
    app.kubernetes.io/part-of: uni-lab-demo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uni-lab-demo-edge
  namespace: xiongyanfei
  labels:
    app.kubernetes.io/name: uni-lab-demo-edge
    app.kubernetes.io/part-of: uni-lab-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uni-lab-demo-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uni-lab-demo-edge
        app.kubernetes.io/part-of: uni-lab-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 57439
        runAsGroup: 57439
        fsGroup: 57439
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-resource-bootstrap
          image: uni-lab-demo-edge:manual-confirm-20260803-1
          imagePullPolicy: Never
          args:
            - unilab
            - --graph
            - /etc/unilabos/instance_bootstrap.json
            - --config
            - /etc/unilabos/local_config.py
            - --working_dir
            - /tmp/unilabos
            - --addr
            - http://uni-lab-demo-backend:8080/api/v1
            - instance-sync
            - --check_only
          env:
            - name: UNILABOS_OTELCONFIG_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://signoz-otel:4317
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: uni-lab-edge-bootstrap-check
            - name: OTEL_SERVICE_VERSION
              value: manual-confirm-20260803-1
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: demo
            - name: OTEL_TRACES_SAMPLER
              value: always_on
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/unilabos
              readOnly: true
      containers:
        - name: edge
          image: uni-lab-demo-edge:manual-confirm-20260803-1
          imagePullPolicy: Never
          args:
            - unilab
            - --graph
            - /etc/unilabos/demo_devices.json
            - --config
            - /etc/unilabos/local_config.py
            - --working_dir
            - /data
            - --backend
            - ros
            - --app_bridges
            - fastapi
            - --port
            - "8002"
            - --disable_browser
            - --visual
            - disable
          env:
            - name: UNILABOS_OTELCONFIG_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://signoz-otel:4317
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: uni-lab-edge
            - name: OTEL_SERVICE_VERSION
              value: manual-confirm-20260803-1
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: demo
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: edge.key=demo-edge-a,k8s.namespace.name=xiongyanfei
            - name: ROS_DOMAIN_ID
              value: "78"
            - name: ROS_LOCALHOST_ONLY
              value: "0"
          ports:
            - name: http
              containerPort: 8002
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/unilabos
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: uni-lab-demo-edge-config
        - name: data
          persistentVolumeClaim:
            claimName: uni-lab-demo-edge-data
