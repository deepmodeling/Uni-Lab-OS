name: Deploy Docs

on:
  # 在 CI Check 成功后自动触发（仅 main 分支）
  workflow_run:
    workflows: ["CI Check"]
    types: [completed]
    branches: [main]
  # 手动触发
  workflow_dispatch:
    inputs:
      branch:
        description: '要部署文档的分支'
        required: false
        default: 'main'
        type: string
      deploy_to_pages:
        description: '是否部署到 GitHub Pages'
        required: false
        default: true
        type: boolean

# 设置 GITHUB_TOKEN 权限以部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，跳过正在进行和最新排队之间的运行
# 但是不取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build documentation
  build:
    # 只在以下情况运行：
    # 1. workflow_run 触发且 CI Check 成功
    # 2. 手动触发
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      UNILABOS_DOCS_REQUIRE_ROS: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # workflow_run 时使用触发工作流的分支，手动触发时使用输入的分支
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Setup Miniforge (with mamba)
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          use-mamba: true
          python-version: '3.14.10'
          channels: conda-forge,robostack-jazzy,uni-lab
          channel-priority: strict
          activate-environment: unilab
          auto-update-conda: false
          show-channel-urls: true

      - name: Install native ROS message definitions for complete documentation
        run: |
          mamba install -n unilab --override-channels -c uni-lab -c conda-forge -c robostack-jazzy numpy=2 robostack-jazzy::ros-jazzy-ros-core robostack-jazzy::ros-jazzy-control-msgs robostack-jazzy::ros-jazzy-nav2-msgs uni-lab::ros-jazzy-unilabos-msgs=0.12.1 -y

      - name: Install latest unilabos from source
        run: |
          mamba run -n unilab python scripts/build_wheel_release.py --dependencies-only
          mamba run -n unilab pip install --find-links dist/wheel-release/wheelhouse ".[full]"
          mamba run -n unilab pip check

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        if: |
          github.event.workflow_run.head_branch == 'main' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_pages == 'true')

      - name: Build Sphinx documentation
        run: |
          cd docs
          mamba run -n unilab python -m sphinx -b html . "${{ runner.temp }}/unilab-docs/html" -d "${{ runner.temp }}/unilab-docs/doctrees" -v

      - name: Check build results
        run: |
          echo "Documentation build completed, checking output directory:"
          test -f "${{ runner.temp }}/unilab-docs/html/index.html"
          git diff --exit-code -- docs

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v5
        if: |
          github.event.workflow_run.head_branch == 'main' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_pages == 'true')
        with:
          path: ${{ runner.temp }}/unilab-docs/html

  # Deploy to GitHub Pages
  deploy:
    if: |
      github.event.workflow_run.head_branch == 'main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_pages == 'true')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
