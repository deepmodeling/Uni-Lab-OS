# 保留上游发行包及字体许可；full 集成测试会导入全部字体并执行 pip check。
package:
  name: rinoh-typeface-texgyrepagella
  version: 0.1.1
source:
  url: https://files.pythonhosted.org/packages/6a/2a/86db888c244f11bb0f6fed72c75b09dba9dbf8aa72e7b69c27cf7975340f/rinoh-typeface-texgyrepagella-0.1.1.tar.gz
  sha256: 53f4dba338c6b1df758888f23ce1ed728e5be45746f161488ad3b944e5e79fd2
build:
  noarch: python
  number: 1
  script: python -m pip install . --no-deps --no-build-isolation
requirements:
  host:
    - python >=3.14,<3.15
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.14,<3.15
    - rinohtype >=0.5.4
tests:
  # 单个字体构建时其余字体尚未构建；这里验证字体数据和入口，full 再验证完整依赖闭环。
  - script:
      - python -c "from importlib.metadata import distribution; d = distribution('rinoh-typeface-texgyrepagella'); assert d.version == '0.1.1'; assert any(str(p).endswith('.otf') and d.locate_file(p).is_file() for p in d.files); assert any(p.group == 'rinoh.typefaces' for p in d.entry_points)"
about:
  homepage: https://github.com/brechtm/rinoh-typeface-texgyrepagella
  license: LicenseRef-GUST-Font-License
  license_file: rinoh_typeface_texgyrepagella/GUST-FONT-LICENSE.txt
  summary: Original texgyrepagella font package for the complete documentation environment
